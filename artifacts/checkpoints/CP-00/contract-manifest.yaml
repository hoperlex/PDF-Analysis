# CP-00 contract manifest
#
# What this file is. The semantic freeze of checkpoint CP-00: the four reviewed
# families and their content. Adding a checkpoint report or a state document does not
# change it, which is why the repository owner made it the freeze criterion on
# 2026-09-04.
#
# The recipe, and the thing the recipe was missing. For a named commit:
#
#   git ls-tree -r --name-only <commit> -- contracts fixtures docs/architecture scripts
#   sort the paths; for each, feed the UTF-8 path bytes then the RAW 32-byte sha256 of
#   the file content into one sha256. Git-tracked files only.
#
# Until this reconciliation the recipe was published as "reproducible from this file
# alone" and named **no commit**. It is not reproducible from a recipe alone: the same
# recipe over three different trees gives three different values, and the file carried
# two of them under swapped labels. Every aggregate below therefore names the commit it
# was computed over, and every aggregate lists the files that roll into it.
#
# The three trees, measured rather than asserted (git ls-tree at each commit,
# recipe above):
#   92e13fa496a7  reviewed candidate, 100 files -> 39721aac0ebe1aa5c13d0ae3e01ee93380671daddc5d9f3f3b774997d6f75e08
#   39a3a6430bd9  the commit v0.0.0-architecture points at, 100 files -> f362647cc9b1d2201ac4663bf5d877346eeeccf046734219103c3ac822d2845d
#   this file's own commit, 100 files -> a78572288a28b88be7f5dd58b9e79254a9e4f61cb55838ba4308b3be91109b84
#
# A commit cannot name its own hash, which is why the third is bound to "this file's
# own commit" rather than to a SHA. It is the value artifact_manifest_sha256 carries:
# the manifest describes the tree it ships in. It differs from the tagged tree by
# exactly the two files the review_status disposition moved, recorded in erratum.md.

checkpoint: CP-00
tag: v0.0.0-architecture
reviewed_candidate_commit: 92e13fa496a723ed6e4c3adbf138c4f4e1d7c368
qa_evidence_commit: 3da104e5d6fafb2a581bda377a07911183af803f
migration_head: none

# --- aggregate one: the immutable reviewed input -----------------------------------
# What W0-QA-01 certified. Frozen for good at the reviewed candidate; it is not
# recomputed over any later tree and it never changes.
reviewed_input_manifest_commit: 92e13fa496a723ed6e4c3adbf138c4f4e1d7c368
reviewed_input_manifest_sha256: 39721aac0ebe1aa5c13d0ae3e01ee93380671daddc5d9f3f3b774997d6f75e08
reviewed_input_manifest_files: 100

# --- aggregate two: the published CP-00 checkpoint tree -----------------------------
# What the annotated tag v0.0.0-architecture points at. Recorded because the tag
# message states the *reviewed input* value for its own tree, which is false of that
# commit; see erratum.md, E-1.
tagged_checkpoint_commit: 39a3a6430bd97c38cb20bafc793fc9d077d0df8e
tagged_checkpoint_manifest_sha256: f362647cc9b1d2201ac4663bf5d877346eeeccf046734219103c3ac822d2845d
tagged_checkpoint_manifest_files: 100

# --- aggregate three: the final checkpoint manifest ---------------------------------
# The reviewed families in the tree that carries this file, which is the tree a
# superseding ratification will certify. Members: every file under families: below,
# all 100 of them, each with its own sha256. No aggregate here carries a member it
# does not list.

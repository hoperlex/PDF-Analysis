# The alpha stack: PostgreSQL, the object store, the API, the worker, the web app and one
# proxy.
#
#   cp infra/deploy/env/alpha.env.example infra/deploy/env/alpha.env   # then edit it
#   cp infra/deploy/env/provider.env.example infra/deploy/env/provider.env
#   docker compose --env-file infra/deploy/env/alpha.env \
#     -f infra/deploy/compose.server.yml up -d --build
#
# Run it from the REPOSITORY ROOT: the three builds need `src/`, `db/`, `uv.lock`, `web/`
# and `infra/postgres/` in their context, so the context is `..\..` relative to this file.
#
# `infra/local/docker-compose.yml` is NOT this file and neither replaces the other. That
# one is the developer's disposable pair, driven only by the frozen `make up`/`make down`,
# with its images pinned by the Makefile's own bytes. This one is the deployed stack: it
# publishes ONE port, it carries the application, and it takes its images from a file an
# operator can read.
#
# `T-4`: there is no `make` target for any of this. `OD-16` makes a tenth root target an
# FF-01 freeze-break needing an explicit break record, and nothing here needs one.
#
# TWO DATABASE ROLES, TWO URLS (`PROD-04-DB-ROLES-01`, `R-146n` item 1, `AD-02`, `ADR-0021` section 3).
# `DATABASE_URL` is the APPLICATION's: `api` and `worker` connect as `ALPHA_APP_DB_USER`, a role that cannot
# change the schema, cannot truncate and owns nothing. `MIGRATOR_DATABASE_URL` is the OWNER's (`POSTGRES_USER`):
# only the one-shot `migrate` and `release-notes` below receive it, and the operator tools that need
# write-everything are handed it by their wrappers -- it is in no always-on service's environment. The rights of
# the application role are applied by `infra/deploy/apply-grants.sh` after every `migrate` and every restore
# (a `pg_dump --no-owner --no-privileges` carries none); `deploy.sh` runs it between `migrate` and `up`.
#
# LOG ROTATION AND MEMORY LIMITS (`ERASE-WRAP-01` for `PROD-05b`; `R-146n` item 2, `ADR-0021` section 4 / `AD-04`, `D-166`).
# The six long-running services (`postgres`, `s3`, `api`, `worker`, `web`, `proxy`) each carry a `logging:` block (the
# `json-file` driver, `max-size` 10m and `max-file` 5, so at most 50 MB of log per service and 300 MB for the stack; a
# CONTAINER KEEPS THE LOG CONFIGURATION IT WAS CREATED WITH, so a service is rotated once `docker compose up` recreates
# it, which a deploy does) and a `mem_limit:` read from `ALPHA_MEM_LIMIT_<SERVICE>`. **No memory number is invented
# here**: the measurement `PROD-05a` (`docker stats --no-stream` during a 500-page analysis on the 4 GB host,
# `R-146ad`) has not been taken, and a limit below the worker's footprint would kill it in the middle of a run. A variable
# that is unset or empty becomes `0`, which Docker reads as NO LIMIT -- the behaviour before this block existed. The
# owner sets the six values in `alpha.env` after measuring (runbook section 19). The three one-shot services (`s3-init`,
# `migrate`, `release-notes`) are not long-running and carry neither.
#
# IMAGE IDENTITY. Every third-party image input is pinned by digest. PostgreSQL is a
# repository-owned derivative of its exact base plus checksum-pinned pgvector.
# MINIO-IMAGE-01 replaces the withdrawn direct object-store repositories with the two
# targets in infra/minio/Dockerfile; that file pins its Go/Alpine inputs by digest and the
# official MinIO/mc source archives by commit and SHA-256.

name: ${ALPHA_INSTANCE:?ALPHA_INSTANCE is unset. Pass --env-file infra/deploy/env/alpha.env.}

networks:
  alpha:
    name: ${ALPHA_INSTANCE:?ALPHA_INSTANCE is unset.}-net

# `down` never removes these; only `down --volumes` would. `R-4` makes that matter: real
# client documents may be uploaded, and the only sanctioned way to remove them is
# `infra/deploy/reset.sh`, which dumps before it drops.
volumes:
  postgres-data:
    name: ${ALPHA_INSTANCE:?ALPHA_INSTANCE is unset.}-postgres-data
  s3-data:
    name: ${ALPHA_INSTANCE:?ALPHA_INSTANCE is unset.}-s3-data
  # `R-51`. The session register, and it is mounted by the `web` service and by nothing
  # else. Before it, `web/src/app/bff/session/store.ts` held every open session in the Node
  # process's memory, and `deploy.sh` recreates that container on every run -- so every
  # deploy signed every reviewer out, which is a support incident per deployment rather
  # than a rare one.
  #
  # WHAT IS ON IT, stated here as well as in the runbook because a volume nobody can
  # describe is a volume nobody can decide about: until each credential expires, the API
  # credentials the web tier holds are in a file on this volume. They still never reach the
  # browser -- that property is the whole of `W15-AUTH` and is unchanged -- and a revoked
  # credential still stops working on its next request, because the API compares
  # `token_epoch` on every one of them wherever the token was kept.
  #
  # The owner ruled this over the two alternatives: a database connection for the web tier
  # (a `DATABASE_URL` here, a client dependency in `web/package-lock.json`) and a new
  # contract operation to store sessions through (a reseal). Neither is cheaper and both
  # are wider.
  web-sessions:
    name: ${ALPHA_INSTANCE:?ALPHA_INSTANCE is unset.}-web-sessions
  # `EMBED-01` (ADR-0029 decision 8). The directory the worker and the host's timer meet in: the worker writes the batch for the night encoder
  # here and reads the vectors back, `infra/deploy/embed-window.sh` (on the host, by this volume's mountpoint) runs the `embedder` service
  # over it. It holds the TEXT of expert findings for the length of one round and is emptied by the worker after it. The `embedder` and the
  # `worker` mount it and nothing else does.
  embed-exchange:
    name: ${ALPHA_INSTANCE:?ALPHA_INSTANCE is unset.}-embed-exchange

services:
  postgres:
    build:
      context: ../..
      dockerfile: infra/postgres/Dockerfile
      args:
        POSTGRES_BASE_IMAGE: postgres:17.11-trixie@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    image: ${ALPHA_INSTANCE:?ALPHA_INSTANCE is unset.}-postgres-pgvector:17.11-v0.8.6-8ee86c9
    networks: [alpha]
    restart: unless-stopped
    mem_limit: ${ALPHA_MEM_LIMIT_POSTGRES:-0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is unset.}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is unset.}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is unset.}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    # NO `ports:`. Nothing but the proxy leaves this host. The developer stack publishes
    # 127.0.0.1 only; this one publishes nothing at all.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # `pg_isready` alone is not readiness: during initdb the entrypoint runs a temporary
    # server on the unix socket only, so a socket probe reports ready while the role does
    # not exist yet. Probe TCP and then run a real authenticated query, exactly as
    # infra/local/docker-compose.yml does and for the reason recorded there.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready --quiet --host=127.0.0.1 --port=5432
          --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB"
          && PGPASSWORD="$$POSTGRES_PASSWORD" psql --quiet --no-align --tuples-only
          --host=127.0.0.1 --port=5432 --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB"
          --command='SELECT 1' >/dev/null
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 5s

  s3:
    build:
      context: ../..
      dockerfile: infra/minio/Dockerfile
      target: server
    image: ${ALPHA_INSTANCE:?ALPHA_INSTANCE is unset.}-minio:RELEASE.2025-10-15T17-29-55Z-9e49d5e
    networks: [alpha]
    restart: unless-stopped
    mem_limit: ${ALPHA_MEM_LIMIT_S3:-0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is unset.}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is unset.}
    volumes:
      - s3-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mc alias set local http://127.0.0.1:9000
          "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1
          && mc ready local
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 5s

  # Idempotent private-bucket initialization, reusing the script the foundation already
  # proved rather than a second copy of the same logic.
  s3-init:
    build:
      context: ../..
      dockerfile: infra/minio/Dockerfile
      target: client
    image: ${ALPHA_INSTANCE:?ALPHA_INSTANCE is unset.}-mc:RELEASE.2025-08-13T08-35-41Z-7394ce0
    networks: [alpha]
    depends_on:
      s3:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is unset.}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is unset.}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is unset.}
      S3_INTERNAL_ENDPOINT: http://s3:9000
    volumes:
      - ../local/bucket-init.sh:/usr/local/lib/foundation/bucket-init.sh:ro
    entrypoint: ["/bin/sh", "-c", "set -e; /bin/sh /usr/local/lib/foundation/bucket-init.sh"]
    restart: "no"

  # One shot, then gone. Migrations are a deploy step and never something a serving process
  # does on start: two API replicas starting together would race the same upgrade.
  migrate:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.api
    image: ${ALPHA_INSTANCE:?ALPHA_INSTANCE is unset.}-api
    networks: [alpha]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The OWNER's url: the role that owns every object and the only one that may change the schema.
      DATABASE_URL: ${MIGRATOR_DATABASE_URL:?MIGRATOR_DATABASE_URL is unset. It is the owner role's url (POSTGRES_USER); see infra/deploy/env/alpha.env.example.}
    working_dir: /app
    command: ["alembic", "--config", "db/migrations/alembic.ini", "upgrade", "head"]
    restart: "no"

  # Apply authored release revisions after schema migration. This one-shot
  # service must finish before the API can expose the current VERSION.
  release-notes:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.api
    image: ${ALPHA_INSTANCE:?ALPHA_INSTANCE is unset.}-api
    networks: [alpha]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${MIGRATOR_DATABASE_URL:?MIGRATOR_DATABASE_URL is unset. It is the owner role's url (POSTGRES_USER); see infra/deploy/env/alpha.env.example.}
    working_dir: /app
    command: ["python", "-m", "auditmanager.releases.load"]
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.api
    image: ${ALPHA_INSTANCE:?ALPHA_INSTANCE is unset.}-api
    networks: [alpha]
    restart: unless-stopped
    mem_limit: ${ALPHA_MEM_LIMIT_API:-0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      release-notes:
        condition: service_completed_successfully
    # Named one by one rather than `env_file: alpha.env`, so this file states exactly what
    # the application reads. The service passwords and the NEXT_PUBLIC_* build values are
    # in that file too and have no business inside this container.
    environment:
      # The APPLICATION role's url (ALPHA_APP_DB_USER): it owns nothing and cannot change the schema.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is unset. It is the application role's url (ALPHA_APP_DB_USER); see infra/deploy/env/alpha.env.example.}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?S3_ENDPOINT_URL is unset.}
      S3_REGION: ${S3_REGION:?S3_REGION is unset.}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is unset.}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is unset.}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is unset.}
      AUDITMANAGER_PROVIDER_MODE: ${AUDITMANAGER_PROVIDER_MODE:?AUDITMANAGER_PROVIDER_MODE is unset.}
      # `EXEC-HTTP-01` (R-143). Where a run's model adapter comes from: `environment` (today's
      # `PROXY_LLM_*` / `ANTHROPIC_API_KEY`, the default) or `database` (the connections an
      # administrator manages in the UI). The switch back is the rollback.
      AUDITMANAGER_PROVIDER_SOURCE: ${AUDITMANAGER_PROVIDER_SOURCE:-environment}
      # Presentation comparison exposure is explicit in both API and worker.
      AUDITMANAGER_COMPARISON_MODULES: ${AUDITMANAGER_COMPARISON_MODULES:-versions,stages}
      AUDITMANAGER_EXTENDED_ANALYSIS: ${AUDITMANAGER_EXTENDED_ANALYSIS:-1}
      # `REVIEW-FIX-SEAMS-1102`. The rollback switches of the paid analysis plan. The API prices
      # every fresh estimate (`runs/preflight.py`) and picks the stage plan of every fresh stage
      # run (`comparison/stage_v3/policy.py`); the worker executes the consent and the policy that
      # were frozen at the start and never reads them, so they are named here only. Each default
      # is the code's own default. A `1` switch is turned off by `0`, `false` or `off`; the plan
      # is `v2` (default) or `v3` (opt-in, R-154b) and the coverage takes `legacy`, as in
      # `alpha.env.example`.
      AUDITMANAGER_EXTENDED_ANALYSIS_PLAN: ${AUDITMANAGER_EXTENDED_ANALYSIS_PLAN:-v2}
      AUDITMANAGER_EXTENDED_COVERAGE: ${AUDITMANAGER_EXTENDED_COVERAGE:-batched-v1}
      AUDITMANAGER_EXTENDED_CROSS_WINDOW: ${AUDITMANAGER_EXTENDED_CROSS_WINDOW:-1}
      AUDITMANAGER_NATIVE_PAGE_PIECES: ${AUDITMANAGER_NATIVE_PAGE_PIECES:-1}
      AUDITMANAGER_NORM_PARAGRAPH_CONTEXT: ${AUDITMANAGER_NORM_PARAGRAPH_CONTEXT:-1}
      AUDITMANAGER_PROJECT_PARAMETERS: ${AUDITMANAGER_PROJECT_PARAMETERS:-1}
      AUDITMANAGER_PROJECT_PARAMETER_CONTEXT: ${AUDITMANAGER_PROJECT_PARAMETER_CONTEXT:-1}
      AUDITMANAGER_PROJECT_PARAMETER_REVIEW_CONTEXT: ${AUDITMANAGER_PROJECT_PARAMETER_REVIEW_CONTEXT:-1}
      AUDITMANAGER_STAGE_V3_PLAN: ${AUDITMANAGER_STAGE_V3_PLAN:-windowed-global-v1}
      # Relaxed intake limits (`REVIEW-FIX-BOUNDS-1102`), read on the upload and ingest path; the
      # worker gets the same value as the API. `0`, the default, keeps the strict limits.
      AUDITMANAGER_INTAKE_RELAXED: ${AUDITMANAGER_INTAKE_RELAXED:-0}
      # The PUBLIC half of the key ring that seals a connection's key, and the key id new keys
      # are sealed to. Public, so they live in alpha.env and reach both services; the private
      # ring (`AUDITMANAGER_SECRETS_KEYS`) is in provider.env and only the worker reads it.
      AUDITMANAGER_SECRETS_PUBLIC_KEYS: ${AUDITMANAGER_SECRETS_PUBLIC_KEYS:-}
      AUDITMANAGER_SECRETS_ACTIVE_KID: ${AUDITMANAGER_SECRETS_ACTIVE_KID:-}
      # `EXEC2-ENROLL-01` (ADR-0026 decisions 4 and 6), read by the `api` only. The stand's public origin
      # (`https://host[:port]`) that the generated agent install command downloads from. It is the ONLY source
      # of that origin: the web tier drops the forwarded `Host`, so one guessed from the request would be the
      # API's internal name. Unset, it is derived from the certificate name (`https://` and `ALPHA_CERT_NAME`);
      # with neither set it is `https://`, which the API refuses as no origin (`503 dependency_unavailable`,
      # `public_origin`), never a fallback. Set it for a stand reached through a tunnel or a private name.
      # And where the image keeps the agent package (`auditmanager-agent-<version>.tar.gz` and its
      # `.sha256`); blank is the image's own `/app/agent-package`.
      AUDITMANAGER_PUBLIC_ORIGIN: ${AUDITMANAGER_PUBLIC_ORIGIN:-https://${ALPHA_CERT_NAME:-}}
      AUDITMANAGER_AGENT_PACKAGE_DIR: ${AUDITMANAGER_AGENT_PACKAGE_DIR:-}
      # `T-6`. Required at construction since `W14-PKG`: a container started without it
      # exits non-zero instead of serving `authentication_required` to everything.
      AUDITMANAGER_API_TOKEN: ${AUDITMANAGER_API_TOKEN:?AUDITMANAGER_API_TOKEN is unset. The seam is fail-closed; see infra/deploy/env/alpha.env.example.}
      # `R-105`. A LITERAL, set here per service and never in alpha.env: the API claims no
      # run, only the `worker` service below does, and both fence expired leases.
      # `deploy.sh` refuses a compose file in which `api` or `worker` lacks this line.
      # Rollback (W54-PLAN 3.10): `all` here and no `worker` service is W53's behaviour.
      EXECUTION_ROLE: api
    # `EXEC-HTTP-01` (R-143, plan section 4.1): the `api` no longer loads provider.env. It makes
    # no model call when the separate worker runs, so it holds neither the provider credential
    # nor the private key ring; it seals a connection's key to the PUBLIC keys above and can
    # never open one. A stolen admin session or a compromised api can therefore replace a key
    # but not read one. (The worker below still reads the file.)
    # No `ports:`. The proxy reaches 8000 and 8001 over the compose network.
    healthcheck:
      # `T-3`'s liveness plane on the SECOND port, which needs no credential. Polling
      # /api/v1 would need the token and would make an unconfigured deployment look dead
      # rather than unconfigured.
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8001/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  # `R-105`, `W54-WORKER-01`. The only process that claims runs: the API's image and code,
  # started as `python -m auditmanager.workers serve`. The API's environment except the
  # deployment secret -- the worker answers no request, refuses to start while that secret
  # is present, and is never given it -- plus the same provider credential file. No
  # `ports:`, and not on the session volume.
  worker:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.api
    image: ${ALPHA_INSTANCE:?ALPHA_INSTANCE is unset.}-api
    networks: [alpha]
    restart: unless-stopped
    mem_limit: ${ALPHA_MEM_LIMIT_WORKER:-0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      release-notes:
        condition: service_completed_successfully
    command: ["python", "-m", "auditmanager.workers", "serve"]
    environment:
      # The APPLICATION role's url (ALPHA_APP_DB_USER): it owns nothing and cannot change the schema.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is unset. It is the application role's url (ALPHA_APP_DB_USER); see infra/deploy/env/alpha.env.example.}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?S3_ENDPOINT_URL is unset.}
      S3_REGION: ${S3_REGION:?S3_REGION is unset.}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is unset.}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is unset.}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is unset.}
      AUDITMANAGER_PROVIDER_MODE: ${AUDITMANAGER_PROVIDER_MODE:?AUDITMANAGER_PROVIDER_MODE is unset.}
      # `EXEC-HTTP-01` (R-143). Where a run's model adapter comes from: `environment` (today's
      # `PROXY_LLM_*` / `ANTHROPIC_API_KEY`, the default) or `database` (the connections an
      # administrator manages in the UI). The switch back is the rollback.
      AUDITMANAGER_PROVIDER_SOURCE: ${AUDITMANAGER_PROVIDER_SOURCE:-environment}
      # Presentation comparison exposure is explicit in both API and worker.
      AUDITMANAGER_COMPARISON_MODULES: ${AUDITMANAGER_COMPARISON_MODULES:-versions,stages}
      AUDITMANAGER_EXTENDED_ANALYSIS: ${AUDITMANAGER_EXTENDED_ANALYSIS:-1}
      # `REVIEW-FIX-BOUNDS-1102`. Relaxed intake limits; the same value the API reads. `0`, the
      # default, keeps the strict limits.
      AUDITMANAGER_INTAKE_RELAXED: ${AUDITMANAGER_INTAKE_RELAXED:-0}
      # The PUBLIC half of the key ring that seals a connection's key, and the key id new keys
      # are sealed to. Public, so they live in alpha.env and reach both services; the private
      # ring (`AUDITMANAGER_SECRETS_KEYS`) is in provider.env and only the worker reads it.
      AUDITMANAGER_SECRETS_PUBLIC_KEYS: ${AUDITMANAGER_SECRETS_PUBLIC_KEYS:-}
      AUDITMANAGER_SECRETS_ACTIVE_KID: ${AUDITMANAGER_SECRETS_ACTIVE_KID:-}
      # `EXEC2-ENROLL-SSH-01` (ADR-0026 decision 7). Path A -- an agent installed over SSH from the UI -- is run
      # by this service, which issues the enrollment grant and tells `install.sh` where the stand is, so it
      # reads the SAME two values as the `api` (see the API service above for what each means): the stand's
      # public origin, with the same default, and where the image keeps the agent package. The origin is never
      # guessed: with neither it nor `ALPHA_CERT_NAME` set it is `https://`, which the worker refuses as no
      # origin and the session fails (`enrollment_failed`).
      AUDITMANAGER_PUBLIC_ORIGIN: ${AUDITMANAGER_PUBLIC_ORIGIN:-https://${ALPHA_CERT_NAME:-}}
      AUDITMANAGER_AGENT_PACKAGE_DIR: ${AUDITMANAGER_AGENT_PACKAGE_DIR:-}
      # A literal, like the API's. See the API service above.
      EXECUTION_ROLE: worker
      # The identity and heartbeat files the health check reads. On the tmpfs below, so a
      # restarted container registers as a new worker and leaves no stale identity.
      AUDITMANAGER_WORKER_STATE_DIR: /run/auditmanager
      # `EXEC-PAR-QUEUE-01`. How many runs this worker executes at once: a whole number from 1 to
      # 16. The default is 1, one run at a time, which is also the rollback; anything else stops
      # the worker at start. Whatever it is, one executor connection has at most one active run.
      # The `api` never reads it.
      AUDITMANAGER_WORKER_SLOTS: ${AUDITMANAGER_WORKER_SLOTS:-1}
      # `R-149g`. Whether path A (an agent installed over SSH from the UI) may reach a PRIVATE-range target
      # (RFC 1918, unique-local, shared address space): `1` or `0`, default `0`, which is the rule before this
      # setting existed. `1` lets the stand SSH into its hosting's internal networks; loopback, link-local, the
      # compose network and service names stay refused either way. Anything but `1` or `0` is read as `0` and
      # logged by name. Only the worker reads it; the `api` does not (see `README.md`, the universal agent).
      AUDITMANAGER_AGENT_INSTALL_ALLOW_PRIVATE: ${AUDITMANAGER_AGENT_INSTALL_ALLOW_PRIVATE:-0}
      # `EXEC2-GROUP-RUN-01` / `EXEC2-GROUP-CMP-01` (ADR-0026 decision 15): how long group work waits while every member
      # is offline before it ends `no_executor_online` (whole seconds, 1..604800; a blank value refuses to start,
      # so the default is written here).
      AUDITMANAGER_GROUP_OFFLINE_WAIT_SECONDS: ${AUDITMANAGER_GROUP_OFFLINE_WAIT_SECONDS:-1800}
      # `EMBED-01` (ADR-0029 decision 8). Where the worker leaves the batch for the night encoder and finds its vectors (the volume below).
      # A literal: the directory is the one the volume is mounted at. The worker's pass that uses it is wired by the composition root; until
      # then nothing reads this name, and a worker without it does nothing about the window.
      AUDITMANAGER_EMBED_DIR: /embed
    # The provider credential, the private key ring and the optional destination allowlist
    # (`AUDITMANAGER_EXECUTOR_ALLOWED_HOSTS`): a separate file the owner writes on the host,
    # never passed to --env-file, so it stays out of compose substitution and therefore out
    # of `docker compose config` output. The worker is the only service that reads it.
    env_file:
      - path: env/provider.env
        required: false
    tmpfs:
      - /run/auditmanager:uid=10001,gid=10001,mode=0700,size=1m
    # `EMBED-01`: the exchange with the night encoder (see the volume above). The only mount of this service.
    volumes:
      - embed-exchange:/embed
    # `SIGTERM` drains: no new claim, the run in flight finishes (at most 270 s, then the
    # process exits and its lease expires into the reclaim). Above that drain on purpose.
    stop_grace_period: 300s
    healthcheck:
      test: ["CMD", "python", "-m", "auditmanager.workers", "health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 10s

  web:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.web
      args:
        # Build arguments, because Next inlines every NEXT_PUBLIC_* value into the browser
        # bundle at build time. `/api/v1` is relative, so the image names no origin.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is unset.}
        NEXT_PUBLIC_INSTANCE_LABEL: ${NEXT_PUBLIC_INSTANCE_LABEL:-alpha}
    image: ${ALPHA_INSTANCE:?ALPHA_INSTANCE is unset.}-web
    # Runtime, not build args: these must NOT be inlined into the browser bundle.
    # NO SIGNING KEY HERE -- `HARDEN-01`, `EXPOSURE-REVIEW-02` `F-03`. The deployment secret the `api`
    # service receives is the key the API SIGNS every user credential with (`derive_signing_key`):
    # whoever holds it mints a credential for any known account offline, an administrator's
    # included. This service used to receive it under the comment "the web tier forwards it;
    # without it every operation answers 401", which stopped being true when the bearer became
    # a per-session credential: no module under `web/src` reads it (`getApiToken` and
    # `hasServerCredential` have no caller; `credentialed-forward.ts` presents "a session's,
    # never the deployment's signing key"). The web tier is the container an internet visitor
    # reaches first, so it must not hold the one secret whose loss is a takeover.
    # `tests/integration/composition/test_web_service_holds_no_signing_key.py` holds this.
    environment:
      AUDITMANAGER_API_UPSTREAM: http://api:8000
      # `R-51`. The file on the volume below. A literal and not a `${...}` substitution:
      # it is a path inside this image, fixed by `Dockerfile.web`, and not a deployment
      # choice -- an operator who could set it could point it outside the volume and get a
      # register that silently stops surviving deploys. Unset, the register is memory only
      # and says so in the container's log on the first sign-in; that is the developer's
      # `next dev` and never this file.
      AUDITMANAGER_SESSION_STORE: /var/lib/auditmanager/sessions/register.json
      AUDITMANAGER_BEHIND_PROXY: "1"  # W49-EDGE-01: no published port, so X-Real-IP is the proxy's and may key the guest throttle
    volumes:
      # The ONLY service that mounts it. `R-51` says so and this line is where it is true:
      # the credential this file holds must not be reachable from the API container, the
      # proxy, or a second web replica this stack does not run.
      - web-sessions:/var/lib/auditmanager/sessions
    networks: [alpha]
    restart: unless-stopped
    mem_limit: ${ALPHA_MEM_LIMIT_WEB:-0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    networks: [alpha]
    restart: unless-stopped
    mem_limit: ${ALPHA_MEM_LIMIT_PROXY:-0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # `REAL-IP-EDGE-01`. Runs before nginx starts and turns the value below into
      # `conf.d/trusted-proxies.conf`, or into nothing. See `proxy/trusted-proxies.sh`.
      - ./proxy/trusted-proxies.sh:/docker-entrypoint.d/26-trusted-proxies.sh:ro
    environment:
      # Which peers may tell the proxy who the client is, through `X-Forwarded-For`. EMPTY
      # BY DEFAULT, and empty trusts nobody: the header is ignored and every request is
      # counted under the peer that connected -- the behaviour before this line existed.
      # A list of CIDRs (comma or space separated) is for a host whose TLS terminator is
      # another nginx in front of this one; `infra/deploy/README.md`, "The client address",
      # says which value and what the terminator must send. A CIDR is not a secret, so
      # `docker compose config` printing it is harmless.
      ALPHA_TRUSTED_PROXY_CIDRS: ${ALPHA_TRUSTED_PROXY_CIDRS:-}
    # THE ONE PUBLISHED PORT. `T-2`: one origin, the web app at `/` and the API at
    # `/api/v1`, so there is no cross-origin surface at all.
    #
    # BOUND TO 127.0.0.1 BY DEFAULT, ruled by the owner 2026-09-22 closing `D-49`.
    #
    # This line used to read `"${ALPHA_HTTP_PORT}:8080"` with no interface, which binds
    # `0.0.0.0`. That was measured, not supposed: on 2026-09-22 `GET http://<host public ip>:31500/bff/v1/projects`
    # answered **200**, because `/bff/v1` then served every operation of this surface — writes
    # included — to anyone, the BFF adding the credential server-side. **THAT IS HISTORY AND IS NOT
    # TODAY'S BEHAVIOUR:** since wave 34 the BFF forwards a credential only for a live session
    # cookie and answers `401 authentication_required` to everyone else
    # (`web/src/app/bff/v1/[...path]/route.ts`), and since `R-31` `/api/v1/openapi.json` answers
    # `401` too; `docs/program/EXPOSURE-REVIEW-01.md` `E-8` re-measured both. The loopback default
    # stays, as the second line of defence it always was. `ufw` was not in the way and could
    # not be: a Docker-published port never reaches ufw's `INPUT` chain, since Docker writes
    # its own `nat/DOCKER` and `filter/DOCKER` rules, which are traversed first. `ufw status`
    # said one port was open while this one answered the world.
    #
    # Reaching the stand is now `ssh -L 31500:127.0.0.1:31500 <host>` and opening
    # `http://127.0.0.1:31500` locally. `ALPHA_BIND_ADDRESS` exists so a host that genuinely
    # should publish the PLAIN application port — one behind a real firewall — can say so
    # deliberately in `alpha.env`, rather than getting it by default from an omission. **The
    # default is the safe value and changing it is a decision someone has to write down.**
    #
    # `PROD-01-TLS-ACME-01` (`ADR-0021` section 2, `R-146a`, `R-146s`): THIS PORT IS THE FIRST OF
    # THREE LISTENERS AND THE ONLY ONE THIS FILE PUBLISHES. When `ALPHA_CERT_NAME` is set,
    # `deploy.sh` adds `infra/acme/compose.acme.yml` (an ACME client, and public port 80 for the
    # challenge and a redirect -- no application route) and, for a deploy that is cleared to
    # publish and has a certificate, `infra/deploy/proxy/compose.tls.yml` (public port 443). With the
    # name empty nothing is added and this file is the whole stack, as before. The application
    # port stays on loopback in every case; the old `ALPHA_BIND_ADDRESS` route to a public plain
    # listener is refused once a name is set.
    ports:
      - "${ALPHA_BIND_ADDRESS:-127.0.0.1}:${ALPHA_HTTP_PORT:?ALPHA_HTTP_PORT is unset.}:8080"

  # `EMBED-01` (ADR-0029 decision 8, plan-v5 section 5). The offline encoder of the precedents' vectors: `bge-m3-dense-v1` in the norms-worker image,
  # run by the host's timer (`infra/deploy/embed-window.sh`) inside the night window and by nothing else.
  #
  #   * IN THE PROFILE `embedder`, so `up`, `build` and `ps` never start or build it. `deploy.sh` builds its image only when ALPHA_EMBEDDER=yes
  #     (the image is 5.5 GB and a rebuild needs 9.5 GB of disk: `docs/program/W54-EMBED-BUILD-01.md`).
  #   * NO NETWORK (`network_mode: none`), NO DATABASE (no `DATABASE_URL`, no `networks`, no `depends_on`, no `env_file`), NO SECRET. The image sets
  #     the hub offline. The container reads one file and writes two; it cannot reach anything else, and it holds the text of findings only
  #     for the minutes it runs.
  #   * A HARD MEMORY LIMIT THAT HAS NO DEFAULT. `${ALPHA_MEM_LIMIT_EMBEDDER:?...}` makes compose refuse to render this file at all while the
  #     value is unset or empty -- and compose renders the whole file for every command, so an alpha.env without it stops `up` as well: that is
  #     the intent (the encoder's peak, 3 177,9 MiB at the bake-off's threads and batch, sits next to services that have no limit, and a limit
  #     nobody chose is how the host's kernel chooses the victim). NO NUMBER IS INVENTED HERE; the owner sets it from the first night's
  #     measurement. `memswap_limit` is the same value, so the container cannot swap past its limit, and `oom_score_adj: 1000` makes it the
  #     kernel's first victim if the host still runs short: a killed encoder is a skipped window, a killed worker or database is an outage.
  #   * TWO CPUs, TWO THREADS, BATCH EIGHT: `cpus`, the thread variables below and `embed_intents.py` (`THREADS`, `BATCH`).
  #   * The entry is `embed_intents.py`, mounted read-only from the checkout: `embed-texts` of the norms package, plus the over-length texts set
  #     aside (they become `poisoned`, never cut). The image is not changed for it.
  embedder:
    profiles: [embedder]
    build:
      context: ../..
      dockerfile: infra/norms-worker/Dockerfile
    image: ${ALPHA_INSTANCE:?ALPHA_INSTANCE is unset.}-embedder
    network_mode: none
    restart: "no"
    mem_limit: ${ALPHA_MEM_LIMIT_EMBEDDER:?ALPHA_MEM_LIMIT_EMBEDDER is unset. It is the encoder's hard memory limit (for example 3500m); no number is invented. See infra/deploy/README.md, the night encoder.}
    memswap_limit: ${ALPHA_MEM_LIMIT_EMBEDDER:?ALPHA_MEM_LIMIT_EMBEDDER is unset.}
    oom_score_adj: 1000
    cpus: 2
    pids_limit: 256
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700,size=256m
    environment:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HOME: /tmp
    volumes:
      - embed-exchange:/embed
      - ../norms-worker/embed_intents.py:/opt/norms-worker/embed_intents.py:ro
    command:
      - python
      - /opt/norms-worker/embed_intents.py
      - --in
      - /embed/request.json
      - --out
      - /embed/response.json
      - --over-limit-out
      - /embed/over_limit.json
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

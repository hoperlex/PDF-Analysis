# THE CHALLENGE LISTENER -- `PROD-01-TLS-ACME-01`, `ADR-0021` section 2, `R-146s`.
#
# Mounted INTO `/etc/nginx/conf.d/` by `infra/acme/compose.acme.yml` and by nothing else, so it exists exactly
# when a certificate name is configured. It needs no certificate, which is why nginx may always load it
# (the TLS block, which does need one, is the file `enable-tls.sh` guards). The container listens on 8081;
# the overlay publishes that as PUBLIC port 80.
#
# WHAT IT SERVES, and it is two things:
#
#   * `/.well-known/acme-challenge/` from the webroot the ACME client writes (`/var/www/acme`, a volume the
#     proxy mounts READ-ONLY). That is the HTTP-01 challenge: the authority fetches a token by the public
#     name on port 80;
#   * everything else answers `301` to the same path on HTTPS.
#
# WHAT IT NEVER DOES: proxy anything. There is no `proxy_pass` in this file and no route to the API or the
# web app, so a request to port 80 cannot reach the application. That is the commitment of `R-146s`: port
# 80 is open before the seeded password has been changed, and nothing behind it can be asked for anything.
# `tests/integration/composition/test_acme_overlay.py` reads this file and fails on a `proxy_pass`, an
# `auth_request`, a `fastcgi_pass` or any other directive that would hand a request to another tier.
#
# THE REDIRECT TARGET IS `$host`, the name the client asked for, with no port: a client that asks this
# listener by an address the certificate does not name is sent to that address over HTTPS and fails there,
# which is the intended effect. The port is dropped on purpose; the redirect is to the HTTPS port the
# browser would use for that name.
#
# THE SECURITY HEADERS are the same four the application listeners send (`W53-CLOSE` `C-18`), at server
# level and `always`, so the redirect and the 404 of this listener carry them too; no `location` here may
# declare an `add_header` of its own, which would drop them (`tests/contract/test_proxy_security_headers.py`
# reads this file under the same rule). No HSTS: this listener is plain HTTP, where the header means nothing.
#
# It declares no zone, map or other http-level directive, so it can be loaded beside `default.conf` and
# `tls.conf` without stopping the master (`test_edge_credential_gate.py`'s rule for the TLS block).

server {
    listen 8081;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "same-origin" always;

    # A token is a file; a path that is not a file is a 404 and never a directory listing or a fall-through
    # to the redirect below.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# `T-2` -- one origin, and therefore no CORS at all.
#
# The web app is at `/` and the API is at `/api/v1`. The browser sees exactly one origin,
# `NEXT_PUBLIC_API_BASE_URL=/api/v1` is a relative path, and there is no cross-origin
# surface to configure, mis-configure or test. Adding CORS headers would also mean
# touching a frozen contract: `contracts/api/v1/openapi.json` declares no such response
# headers on any of its operations.
#
# This shape is not a design proposed here. The out-of-repo harness at /root/pdf-prototype
# served `/api/v1` itself and proxied everything else to Next on loopback, for these same
# reasons, in `run.sh`'s own words: "One port to forward, one origin in the browser, no
# CORS."
#
# Two things are deliberately NOT here:
#
#  * **`/healthz` and `/readyz` are not proxied.** `T-3` puts the operational plane on the
#    API container's SECOND port, and the proxy reaches it over the compose network. It is
#    an operational surface with no product meaning and nothing outside needs it. Exposing
#    it through the public origin would publish a second surface nobody authorized.
#  * **TLS -- still not in THIS file, and now it has somewhere to be.** `R-1` is ruled --
#    the owner's own VPS -- but the host name, the certificate and who holds root do not
#    exist yet, and `W14-PKG` refused to write a `listen 443 ssl` block pointing at a
#    certificate path that has never existed, on the grounds that that is a document and
#    not a deliverable. **That judgment stands and this block is unchanged.** What
#    `W26-HOST` added is beside it rather than in it: `tls-server.conf` is a TLS server
#    block that nginx NEVER LOADS unless `enable-tls.sh` finds a certificate pair, and
#    `compose.tls.yml` is the overlay that mounts them. With no certificate on the host,
#    the container is exactly the container this file describes -- proved, both halves, in
#    docs/program/reviews/W26-HOST.md section 2. The original boundary is in
#    docs/program/reviews/W14-PKG.md section 6; the runbook is
#    docs/program/DEPLOYMENT_RUNBOOK.md.

# THE CLIENT ADDRESS -- `REAL-IP-EDGE-01`, debts `D-144` and `D-191` `E-3`.
#
# On the deployed stand this container is not the first proxy: a nginx on the HOST terminates
# TLS and passes every request to the published port (`proxy_pass http://127.0.0.1:<port>`).
# Whatever the browser's address is, THIS container accepts the connection from one peer only
# -- the compose network's bridge gateway (measured: 172.29.0.1 for a loopback request to a
# loopback-published port) -- so every per-address bucket below was ONE bucket for all
# visitors, and so was the web tier's guest bucket, which keys the `X-Real-IP` this file sets
# from `$remote_addr`: one script could spend the sign-ups and the token exchange of everyone.
#
# These two lines say HOW a peer that is trusted names the client. They do nothing alone:
# `ngx_http_realip_module` acts only for a connection whose peer matches a `set_real_ip_from`,
# and THERE IS NONE IN THIS FILE, ON PURPOSE. The trusted peers are a fact about one host's
# network, so they come from `ALPHA_TRUSTED_PROXY_CIDRS` (`alpha.env`), which
# `trusted-proxies.sh` turns into `conf.d/trusted-proxies.conf` before nginx starts -- or into
# nothing, which is the default. With nothing trusted this container behaves as it always has:
# `X-Forwarded-For` from anyone is ignored and a request is counted under its TCP peer.
#
# THE RULE, once a peer is trusted. For a request from a trusted peer the client is the
# RIGHTMOST address in `X-Forwarded-For` that is not itself trusted (`real_ip_recursive on`
# walks the chain from the right and steps over every trusted hop); everything to the LEFT of
# it is never read, so a client cannot choose its bucket by writing an address at the start of
# the header. A request from any other peer has its header ignored, whatever it says.
# What the trusted peer APPENDS or SETS on the right is therefore the only thing believed, and
# the host nginx must append or set it (`infra/deploy/README.md`, "The client address").
#
# `$remote_addr` is replaced for the whole request, so `$binary_remote_addr` (every key below),
# the `X-Real-IP` sent upstream (the web tier's key) and the access log all carry the client;
# `$realip_remote_addr` still holds the TCP peer. At http level, so `tls-server.conf`, which
# nginx loads beside this file, inherits both lines and repeats neither.
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# NO VERSION IN THE BANNER -- `HARDEN-01`, `EXPOSURE-REVIEW-02` `F-16`. Without this every answer
# carried `Server: nginx/<version>` (observed 1.24.0 on the live stand) and every error page the
# version too: it tells a scanner which advisories to try. At http level, so `tls-server.conf` and
# `acme-challenge.conf`, which nginx loads beside this file, inherit it and repeat nothing; a
# `server_tokens on` anywhere below this line would undo it for that block alone.
server_tokens off;

# THE GUEST THROTTLE -- `W49-EDGE-01`, `W49-PLAN.md` section 3.5. Declared here, ONCE.
#
# `/api/v1/` is public behind this proxy, and since `W49-SEAL-01` it carries the calls a
# stranger may make with no credential at all: `submitRegistration`
# (`POST /api/v1/registrations`) and `readRegistrationStatus`
# (`POST /api/v1/registrations/status`). Those are throttled per client address, and so is
# the credential exchange (`issueToken`, the token-exchange throttle below); and, since
# `EXEC-PULL-01`, the four calls a runner makes with a runner token (the runner-channel
# throttle, declared after the token-exchange one); nothing else on this origin is.
#
# WHY THESE LINES ARE OUTSIDE THE SERVER BLOCK, AND ONLY IN THIS FILE. `map` and
# `limit_req_zone` are http-level directives. With TLS on, nginx loads this file (mounted as
# `conf.d/default.conf`) and `tls-server.conf` (copied beside it as `conf.d/tls.conf` by
# `enable-tls.sh`) at the same time, and a zone or a map variable declared in both is a
# duplicate that stops the master from starting. This is the file that is always loaded, so
# it declares them, and both server bodies use them: the `limit_req` lines and the
# `@rate_limited` location below are copied into `tls-server.conf` with the rest of the body.
#
# THE KEY IS `$request_method:$uri`, MATCHED WHOLE, NEVER AS A PREFIX. It yields the client
# address for the registration calls and the EMPTY STRING for every other request, and
# `limit_req` does not account a request whose key is empty -- so uploads, runs, verdicts,
# the administrator's `GET /api/v1/registrations` and its approve and reject calls are
# never throttled. `$uri` is the normalised path (percent-decoded, slashes merged, no query
# string), so `/api/v1//registrations?x=1` is the same key as the plain spelling and is not
# a way around the limit. A map compares strings without regard to case: the case variants
# it also catches (`/api/v1/REGISTRATIONS`) are paths the application answers 404, so the
# only effect is that hammering one of them spends the caller's own registration budget.
#
# THE ADDRESS IS `$binary_remote_addr`, which follows `$remote_addr`: the peer of the TCP
# connection this container accepted, or -- only when that peer is one `ALPHA_TRUSTED_PROXY_CIDRS`
# lists, see the block at the top -- the client it reports. It is never the first element of
# `X-Forwarded-For`, whose first element is whatever the client wrote. With nothing trusted
# (the default), behind the default `127.0.0.1` binding and an SSH tunnel every caller arrives
# from the same peer, so there the budget below is shared by all direct callers of `/api/v1/`;
# the browser's own registration goes through `/bff/v1` to `http://api:8000` and never meets
# this limit (it meets the web tier's bucket instead, keyed by `X-Real-IP` below).
#
# THE RATE: six a minute sustained (one every ten seconds), a burst of ten answered at once,
# one bucket per address shared by both calls. A person registers once, retries a refusal
# -- a taken login, a validation error -- a few times, and asks after the request now and
# then; ten at once leaves room for that and for a handful of colleagues behind one office
# address. The sustained rate is what the pending-request cap in
# `src/auditmanager/access/registrations.py` needs: unthrottled, one address fills that
# queue as fast as the application can answer a hundred requests; at one request per ten
# seconds after the burst it takes about a quarter of an hour, which is time for an
# administrator to notice. `nodelay`, because a
# delayed request holds a connection open on the one published port while a refusal frees
# it, and the refusal says `retryable: true`. One megabyte of zone keeps about sixteen
# thousand addresses (nginx's own figure for 64-byte states); when it is full the least
# recently used address is dropped, so exhaustion resets the oldest bucket rather than
# refusing everyone.
map "$request_method:$uri" $guest_registration_client {
    default                             "";
    "POST:/api/v1/registrations"        $binary_remote_addr;
    "POST:/api/v1/registrations/status" $binary_remote_addr;
}

limit_req_zone $guest_registration_client zone=guest_registration:1m rate=6r/m;

# THE TOKEN-EXCHANGE THROTTLE -- `HARDEN-AUTH-EDGE-01`, `EXPOSURE-REVIEW-01` `E-4`, `D-192`.
#
# `issueToken` (`POST /api/v1/auth/token`) is the third call a stranger may make with no
# credential, and the only one that was not counted per address: each call spends one PBKDF2
# derivation, for an unknown login as much as for a known one, and the per-account brake in
# `src/auditmanager/access/repository.py` bounds guesses at one ACCOUNT, not the work one
# ADDRESS can ask for. It is counted here, in a zone of its own, so that the registration
# budget above and this one cannot spend each other: a script that has exhausted one still
# meets the other untouched. The browser's sign-in (`POST /bff/v1/session`) does not pass
# through this key at all; it reaches `location /` and meets the web tier's own bucket.
#
# THE SAME KEY, THE SAME ADDRESS, THE SAME RATE AND BURST as the registration calls, for the
# same reasons (read the note above rather than a copy of it here), and the figure is chosen
# against its callers: a script exchanges a credential once per run, and the only in-tree
# caller of this path through the proxy -- `tests/e2e/pc01/journey/verify-acceptance.mjs` --
# makes one call per acceptance. The journey signs in through the browser's own form
# (`POST /bff/v1/session`) and the web tier reaches the API on the compose network, so
# neither crosses this limit. Six a minute with a burst of ten leaves room for a person who
# mistypes a few times; it leaves none for a guesser, whose ceiling after the burst is one
# derivation every ten seconds per address.
map "$request_method:$uri" $token_exchange_client {
    default                      "";
    "POST:/api/v1/auth/token"    $binary_remote_addr;
}

limit_req_zone $token_exchange_client zone=token_exchange:1m rate=6r/m;

# THE RUNNER-CHANNEL THROTTLE -- `EXEC-PULL-01`, `R-143`, `tools/executor-runner/RUNNER_API.md`.
#
# A runner (a Claude Code session behind the stdio bridge, or an unattended agent) calls four
# operations under `/api/v1/runner/tasks/` with a runner token as its bearer credential. The
# token IS the credential: no user session stands in front of these paths, so there is no
# `auth_request` here and no user cookie to key on. They are throttled in two zones of their
# own, so that neither spends the registration or the credential-exchange budget above, nor each
# other's.
#
#  * `runner_channel` counts each TOKEN. The key is the token's twelve-character prefix
#    (`amr_` and eight characters), which a runner presents in every call and the application
#    shows an administrator -- the non-secret half; the secret half never enters the zone. It
#    is the EMPTY STRING for every request that is not a call to `/api/v1/runner/tasks/...`
#    carrying a bearer token of the right shape, and `limit_req` does not account an empty key,
#    so no other path, and no call without a well-formed token, spends this budget. The map
#    reads `$uri` and `$http_authorization` together because a map matches one string.
#    SIXTY A MINUTE, A BURST OF THIRTY, `nodelay`. A runner's steady state is one claim per 25
#    seconds (a long poll answered `204` is followed by the next claim at once), one extension
#    per 80 seconds while it works a task (the lease is 120 seconds and the bridge extends with
#    a third left), and one answer or failure per task: about six requests a minute for one
#    task at a time. At the connection's largest `max_claimed_tasks`, sixteen, each loop is
#    either claiming (2.4 a minute) or holding a task (0.75 extensions a minute and its answer),
#    which stays under forty a minute. 60 r/m is half as much again as that. The 429 is a
#    signal a runner obeys by waiting
#    (`RUNNER_API.md` section 3), so what the ceiling must stop is a loop that does not
#    pace itself: a client that claims with `wait_seconds` 0 and no sleep would otherwise ask
#    the application for an answer as fast as the connection allows, and is held to one a second.
#    `docs/program/EXEC-PULL-01.md` replays a scripted runner against this bucket.
#  * `runner_address` counts each ADDRESS for the same paths, at 300 a minute with a burst of
#    120. The token zone cannot stop a caller who invents a fresh well-formed prefix for every
#    request: each such call costs the application one indexed lookup before it answers 401.
#    The address (`$binary_remote_addr`, see the note above for what it follows) bounds that,
#    and is generous enough for a dozen runners behind one office address.
#
# Both are keyed on the normalised `$uri`, matched as a pattern and not a prefix of anything
# else: `/api/v1/runner/tasks/` and nothing before it.
map "$uri|$http_authorization" $runner_token_client {
    default "";
    "~^/api/v1/runner/tasks/[^|]*\|Bearer (?<runner_token_prefix>amr_[0-9a-z]{8})_[A-Za-z0-9_-]{43}$" $runner_token_prefix;
}

limit_req_zone $runner_token_client zone=runner_channel:1m rate=60r/m;

map $uri $runner_address_client {
    default "";
    "~^/api/v1/runner/tasks/" $binary_remote_addr;
}

limit_req_zone $runner_address_client zone=runner_address:1m rate=300r/m;

server {
    listen 8080;
    server_name _;

    # EVERY ROUTE BUT THE UPLOAD takes a body of at most 26 MiB (`BodyCapMiddleware`, `MAX_BODY`).
    # The body cap the application enforces is its own; this only has to be large enough not
    # to refuse first, because nginx's own 413 is an HTML page and not an `ErrorEnvelope`. 32m
    # leaves the refusal where the contract puts it, with a catalog `error_code`. `uploadDocument`
    # has its own, larger cap in the two upload locations below, and this default is NOT raised
    # for it: a large body is accepted at those two addresses and at no other.
    client_max_body_size 32m;

    # `D-26`. THIS SAID "a model run is slow" UNTIL `W22-OPS`, AND THAT REASON DIED IN
    # `W20-EXEC`. `startRun` no longer waits for the model -- it answers `202` and the
    # browser polls `getRunStatus` -- measured there at 22 ms against 354 ms for a recorded
    # run on a socket, and with a live provider the difference is the whole model call. The
    # failure the 300 s was bought against, a gateway error to a browser with a run still
    # executing behind it, cannot happen any more at any document length. A thirty-page
    # document that takes ten minutes now finishes and the screen shows it.
    #
    # WHAT 300 s BOUNDS NOW is the slowest request that is left, which is `uploadDocument`:
    # up to 26 214 400 bytes through this proxy. Measured in `W20-EXEC` against the running
    # server, three times, 4 KB under the cap: 0.85 s, 0.86 s, 0.87 s. That is the body-read
    # and validation term on loopback, refused at the validator rather than a full accepted
    # upload through a proxy, so it is a FLOOR and not a worst case -- but it settles the
    # order of magnitude as seconds.
    #
    # IT IS STILL 300 s ON PURPOSE. Lowering it would mean claiming a bound, and nothing in
    # this repository measures an accepted cap-sized upload end to end through nginx.
    # Trading a measured margin for a guess is the wrong direction. `W20-EXEC` argued that
    # and `W22-OPS` agrees; what was wrong here was the reason, not the number, and only the
    # reason has changed.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_http_version 1.1;
    # `$http_host` AND NOT `$host` -- `Y-G`, found by `W47-JUDGE-Y` at cross-examination.
    #
    # `$host` is the host name with the PORT STRIPPED. The application builds an absolute
    # redirect out of the request URL, whose authority is this header, so every redirect it
    # produced named **port 80** of whatever the client typed. Measured on the deployed
    # stack on port 56441: `GET /api/v1/dashboard/` answered
    # `location: http://127.0.0.1/dashboard`. Over the owner's own tunnel
    # (`ssh -L 31500:...`) that is port 80 of the OPERATOR'S laptop, and `T-2`'s "one
    # origin" is bent by a redirect that leaves the origin's port.
    #
    # `$http_host` is the Host header as the client sent it, port and all, which is the
    # origin the browser is actually on. HTTP/1.1 requires that header, and nginx answers
    # 400 to a request without one before this line is reached, so there is no case where
    # it is empty and a `$host` fallback would be needed. `$host:$server_port` is NOT the
    # repair: `$server_port` is 8080, this container's internal listen port, not the
    # published one.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SECURITY RESPONSE HEADERS -- `W53-CLOSE` `C-18`. On every answer this origin gives: the
    # web app's, the API's and this file's own `@rate_limited` envelope.
    #
    #  * `nosniff` -- a body is read as the type it is labelled, never guessed into script;
    #  * `X-Frame-Options DENY` and `frame-ancestors 'none'` -- no page on any origin, this
    #    one included, may frame the application, so a sign-in or a verdict cannot be
    #    clickjacked. Both, because the CSP directive is the standard and the header is what
    #    an older browser reads; only `frame-ancestors` -- the policy says nothing about what
    #    the pages may load, which is the application's to decide;
    #  * `Referrer-Policy same-origin` -- an address on this origin, a project or a run id in
    #    it, is never sent to another site.
    #
    # `always`, because without it nginx adds them to 2xx and 3xx answers only, and a 401, a
    # 404 or the 429 below is a page a browser renders too.
    #
    # AT SERVER LEVEL, AND NO `location` MAY ADD A HEADER OF ITS OWN. nginx inherits
    # `add_header` from the enclosing level only when a level declares none, so one
    # `add_header` inside a `location` silently drops all four for that location. A location
    # that needs its own header repeats these four beside it.
    # `tests/contract/test_proxy_security_headers.py` reads every proxying `location` in both
    # files and fails on exactly that.
    #
    # No HSTS here: this listener is plain HTTP, and the header means nothing on it. It is in
    # `tls-server.conf`, which says why.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "same-origin" always;

    # The API, at the versioned base path the contract's `servers` declares.
    #
    # THE PREFIX IS STRIPPED, AND THAT IS NOT A CHOICE MADE HERE. Measured against the
    # running container, not assumed: `GET /projects` answers 401 and
    # `GET /api/v1/projects` answers 404. The frozen document declares
    # `servers: [{"url": "/api/v1"}]`. `src/auditmanager/api/app.py` separately says the
    # contract declares the 115 paths, while its `_SERVERS` comment says those paths
    # are declared relative to the server URL. The application therefore serves
    # `/projects`, `/runs/{id}` and the rest at its own root. **Mounting the base path is
    # the deployment's job.**
    #
    # The out-of-repo harness settled this the same way and wrote it down:
    # /root/pdf-prototype/bridge.py does `target = self.path[len(PREFIX):]` before
    # dispatching. A proxy that forwarded the prefix intact would answer 404 to all
    # 130 operations with a perfectly valid `ErrorEnvelope`, which is the most
    # confusing way this could have failed.
    #
    # The trailing slashes are what does it: `location /api/v1/` with `proxy_pass
    # http://api:8000/` replaces the matched prefix with `/`. The exact-match block below
    # covers the bare `/api/v1`, which nginx would otherwise not rewrite at all.
    # AND THE PREFIX GOES BACK ON THE WAY OUT -- the second half of `Y-G`.
    #
    # `proxy_pass http://api:8000/` strips `/api/v1` on the way in, which is right and is
    # the whole point above. Nothing put it back on the way out, so an absolute redirect
    # from the application named a path this origin serves from the OTHER upstream:
    # `/api/v1/dashboard/` redirected to `/dashboard`, which is the **web screen** of the
    # same name and answers 200. Not a bypass -- the screen renders empty and its data
    # calls answer 401 -- but a caller of the API is sent to the product, which is a
    # correctness defect on the one origin `T-2` promises.
    #
    # `proxy_redirect default` does not reach it: with this `proxy_pass` it expands to
    # `proxy_redirect http://api:8000/ /api/v1/`, and the Location the application builds
    # names the CLIENT's authority (`$http_host` above), never `api:8000`. So the rule is
    # written against any authority instead, and `$1` carries whatever the client asked for.
    #
    # The redirect is left as a redirect rather than removed. Removing it means
    # `redirect_slashes=False` on the application, which is a change to the published
    # surface -- every trailing-slash path would become a 404 instead of a hop -- and that
    # is a decision about the API and not about this file.
    location = /api/v1 {
        proxy_pass http://api:8000/;
        proxy_redirect ~^(https?://[^/]+)/(.*)$ $1/api/v1/$2;
    }

    location /api/v1/ {
        proxy_pass http://api:8000/;
        proxy_redirect ~^(https?://[^/]+)/(.*)$ $1/api/v1/$2;
        # The guest throttle, declared at the top of this file. INSIDE this location and not
        # a new one, so every `/api/v1/` request keeps the one proxying rule above; the key
        # is empty for all but the registration calls, and those alone are counted.
        limit_req zone=guest_registration burst=10 nodelay;
        # The token-exchange throttle, declared beside it at the top of this file. A second
        # `limit_req` and not a second location, for the same reason.
        limit_req zone=token_exchange burst=10 nodelay;
        # The runner-channel throttles, declared beside them at the top of this file: one zone
        # per token and one per address, both empty for every path but `/api/v1/runner/tasks/`.
        limit_req zone=runner_channel burst=30 nodelay;
        limit_req zone=runner_address burst=120 nodelay;
        # nginx's own refusal is 503 with an HTML page, which is neither the status the
        # catalog gives `rate_limited` nor an `ErrorEnvelope` -- the same reason the body cap
        # above is 32m and not the contract's own limit.
        limit_req_status 429;
        # `error_page` reaches only a 429 this proxy produces: `proxy_intercept_errors` is
        # off, so whatever the application answers passes through untouched.
        error_page 429 = @rate_limited;
    }

    # THE TWO UPLOAD LOCATIONS -- `W55B-STREAM-01`, `W55-PLAN.md` section B3.2. `uploadDocument`
    # takes a portal bundle of up to 250 MiB, and a caller reaches it at either of two addresses:
    # `/bff/v1/projects/{uid}/documents` (the web tier, which forwards to the API) or
    # `/api/v1/projects/{uid}/documents` (the API directly, for a script). Only these two take
    # `260m`, which sits above the application's own cap for the route (`UPLOAD_MAX_BODY`, 251
    # MiB) so that the refusal a caller reads is the application's envelope and not nginx's HTML
    # 413 (`D-44`, `tests/e2e/test_upload_limit_headroom.py`). Matched whole, ending at the
    # collection and with one project segment, so no other path gets the larger cap.
    # `W59-VERSION-UPLOAD-01`: `uploadDocumentVersion` takes the same bundle at
    # `.../documents/{document_uid}/versions`, so each regex also admits exactly that one
    # optional suffix -- a document segment and `versions`, nothing deeper (not the
    # classification, section-review or comparison paths under a version).
    #
    # REGEX LOCATIONS, so they win over the prefix locations above and below. A regex location
    # does not strip a prefix by itself, so the API one removes `/api/v1` with `rewrite ... break`
    # and a `proxy_pass` WITHOUT a URI (a URI in `proxy_pass` is ignored once a rewrite has run),
    # and it repeats what `location /api/v1/` does for every request it proxies: the
    # `proxy_redirect` that puts the prefix back on a redirect, and the guest throttle (its key is
    # empty for this path, so it counts nothing here, but the two API locations stay one rule).
    # NO `add_header` AND NO `proxy_set_header` IN EITHER: a location that declares one drops
    # everything inherited from the server level, the four security headers included, so both
    # inherit the server's whole set.
    #
    # THE TIMEOUTS ARE EXPLICIT because they are a chain, longest first: this proxy waits 300 s
    # for the application (`proxy_read_timeout`), the web tier gives up on its own request to the
    # API at 290 s (`AbortSignal.timeout` in `credentialed-forward.ts`), and the application
    # answers an accepted 250 MiB upload within about 240 s (measured, `W55B-STREAM-01.md`).
    # `client_body_timeout` is the gap allowed between two reads of the CLIENT's body, twice the
    # default so that a slow link is not cut off mid-bundle; it does not bound the transfer.
    location ~ ^/api/v1/projects/[^/]+/documents(?:/[^/]+/versions)?$ {
        client_max_body_size 260m;
        client_body_timeout 120s;
        proxy_read_timeout 300s;
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_redirect ~^(https?://[^/]+)/(.*)$ $1/api/v1/$2;
        limit_req zone=guest_registration burst=10 nodelay;
        limit_req zone=token_exchange burst=10 nodelay;
        limit_req zone=runner_channel burst=30 nodelay;
        limit_req zone=runner_address burst=120 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        # The credential is checked BEFORE the body is read -- the note below the two upload
        # locations. `error_page 401` reaches only the refusal this check produces.
        auth_request /_edge/credential/api;
        error_page 401 = @authentication_required;
    }

    location ~ ^/bff/v1/projects/[^/]+/documents(?:/[^/]+/versions)?$ {
        client_max_body_size 260m;
        client_body_timeout 120s;
        proxy_read_timeout 300s;
        auth_request /_edge/credential/web;
        error_page 401 = @authentication_required;
        proxy_pass http://web:3000;
    }

    # THE CREDENTIAL IS CHECKED BEFORE THE BODY -- `HARDEN-AUTH-EDGE-01`, `EXPOSURE-REVIEW-01`
    # `E-5`, `D-192`. These are the only two locations that take a body of 260 MiB, and until
    # now nginx read all of it -- into memory and then into a temporary file on the disk that
    # is this stand's scarce resource -- for ANY caller, and only then handed the request to a
    # tier that answers 401 to a stranger. `client_body_timeout` bounds how long a slow client
    # may stall, not how much it may send, and nothing else on this origin limits the volume.
    #
    # `auth_request` runs in nginx's access phase, which is BEFORE the content phase in which
    # `proxy_pass` reads the body. It asks one cheap, authenticated READ of the tier the
    # request is addressed to -- `getMe` on the API (`GET /me`), the web tier's own
    # `GET /bff/v1/me` for a browser session -- and passes the request on only if that answers
    # 2xx. A 401 or a 403 is a refusal at once, with no byte of the body read; anything else
    # (the tier is down, or answered something unforeseen) is nginx's 500, and the upload is
    # refused with it rather than let through unchecked. The check is one question of
    # "is this credential live", never of "may it upload to THIS project": that stays with the
    # application, which still sees every accepted request and still answers its own 403.
    # The two credentials are the two a caller can hold -- a bearer token on the API path, the
    # session cookie on the web path -- and the check forwards the caller's own headers, so it
    # sees exactly what the application will.
    #
    # WHAT IT COSTS. One extra `getMe` per request to these two upload addresses, GET included
    # (`listDocuments` shares the path with `uploadDocument`, and a subrequest cannot see the
    # method it stands for). A stranger's request now costs the application one credential
    # lookup, which every other path on this origin already costs it; it no longer costs this
    # proxy 260 MiB.
    #
    # THE SUBREQUEST CARRIES NO BODY and no `Content-Length` (`proxy_pass_request_body off`,
    # the header cleared): without that the tier would be told to expect the body being
    # refused. The server-level `proxy_set_header` lines are repeated because a location that
    # declares one drops all it inherited. An INTERNAL location answers 404 to a request from
    # outside, so `/_edge/...` is not an address anybody can ask for.
    #
    # `client_max_body_size 260m` IN BOTH, AND IT IS NOT OPTIONAL. A subrequest shares the
    # request's headers, and nginx compares the DECLARED length with the cap of the location it
    # is entering -- measured: without the line, a 260 MiB announcement meets the server's 32m
    # in the credential location ("client intended to send too large body ... subrequest"),
    # the check answers 413, and `auth_request` turns any status it does not know into a 500
    # for every legitimate upload. The cap is the upload locations' own, so a body that passed
    # the one passes the other; no body is read here, so the figure bounds nothing else.
    # `tests/e2e/test_upload_limit_headroom.py` reads these two as part of the chain.
    #
    # `413` STILL COMES FIRST for a body DECLARED above 260 MiB: nginx compares the declared
    # length with `client_max_body_size` while it is still choosing the location, before the
    # access phase, and that refusal never reads a body either.
    location = /_edge/credential/api {
        internal;
        client_max_body_size 260m;
        proxy_pass http://api:8000/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_edge/credential/web {
        internal;
        client_max_body_size 260m;
        proxy_pass http://web:3000/bff/v1/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The `authentication_required` envelope (`contracts/domain/v1/error-codes.json`), the
    # refusal of that check, built the way the `rate_limited` one below is and held to the
    # catalog the same way: nginx's own 401 is an HTML page, which is not an `ErrorEnvelope`.
    # Single-quoted, no `#`, and no detail, because the catalog declares none for this code.
    location @authentication_required {
        default_type application/json;
        return 401 '{"contract_version":"1.9.0","error_code":"authentication_required","message":"No valid authenticated subject was presented. The response carries no hint about the addressed resource.","correlation_id":"$request_id","retryable":false}';
    }

    # The `rate_limited` envelope (`contracts/domain/v1/error-codes.json`), as JSON and in
    # the shape `error-envelope.schema.json` requires: the message is that code's catalog
    # summary, which is what the application itself sends when no call site supplies one,
    # and `correlation_id` is nginx's `$request_id`, unique per request. No `details`: the
    # catalog declares no safe detail key for this code, because a key naming what was
    # throttled would tell a stranger which login is being tried. Single-quoted, so the
    # JSON's double quotes need no escaping; it must never contain a `#`, which would end
    # the line for the drift check in `test_proxy_tls_path.py`.
    location @rate_limited {
        default_type application/json;
        return 429 '{"contract_version":"1.9.0","error_code":"rate_limited","message":"Too many requests of this kind arrived from this client within the throttle window. Nothing was created or changed; the same request may be sent again later.","correlation_id":"$request_id","retryable":true}';
    }

    # Everything else is the web app.
    location / {
        proxy_pass http://web:3000;
    }
}

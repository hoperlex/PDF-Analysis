# `T-2` -- one origin, and therefore no CORS at all.
#
# The web app is at `/` and the API is at `/api/v1`. The browser sees exactly one origin,
# `NEXT_PUBLIC_API_BASE_URL=/api/v1` is a relative path, and there is no cross-origin
# surface to configure, mis-configure or test. Adding CORS headers would also mean
# touching a frozen contract: `contracts/api/v1/openapi.json` declares no such response
# headers on any of the fifteen operations.
#
# This shape is not a design proposed here. The out-of-repo harness at /root/pdf-prototype
# served `/api/v1` itself and proxied everything else to Next on loopback, for these same
# reasons, in `run.sh`'s own words: "One port to forward, one origin in the browser, no
# CORS."
#
# Two things are deliberately NOT here:
#
#  * **`/healthz` and `/readyz` are not proxied.** `T-3` puts the operational plane on the
#    API container's SECOND port, and the proxy reaches it over the compose network. It is
#    an operational surface with no product meaning and nothing outside needs it. Exposing
#    it through the public origin would publish a second surface nobody authorized.
#  * **TLS -- still not in THIS file, and now it has somewhere to be.** `R-1` is ruled --
#    the owner's own VPS -- but the host name, the certificate and who holds root do not
#    exist yet, and `W14-PKG` refused to write a `listen 443 ssl` block pointing at a
#    certificate path that has never existed, on the grounds that that is a document and
#    not a deliverable. **That judgment stands and this block is unchanged.** What
#    `W26-HOST` added is beside it rather than in it: `tls-server.conf` is a TLS server
#    block that nginx NEVER LOADS unless `enable-tls.sh` finds a certificate pair, and
#    `compose.tls.yml` is the overlay that mounts them. With no certificate on the host,
#    the container is exactly the container this file describes -- proved, both halves, in
#    docs/program/reviews/W26-HOST.md section 2. The original boundary is in
#    docs/program/reviews/W14-PKG.md section 6; the runbook is
#    docs/program/DEPLOYMENT_RUNBOOK.md.

server {
    listen 8080;
    server_name _;

    # `uploadDocument` takes a PDF up to 26214400 bytes. The body cap the application
    # enforces is its own (`BodyCapMiddleware`, and `byte_size <= 26214400` in the
    # envelope); this only has to be large enough not to refuse first, because nginx's own
    # 413 is an HTML page and not an `ErrorEnvelope`. 32m leaves the refusal where the
    # contract puts it, with a catalog `error_code`.
    client_max_body_size 32m;

    # `D-26`. THIS SAID "a model run is slow" UNTIL `W22-OPS`, AND THAT REASON DIED IN
    # `W20-EXEC`. `startRun` no longer waits for the model -- it answers `202` and the
    # browser polls `getRunStatus` -- measured there at 22 ms against 354 ms for a recorded
    # run on a socket, and with a live provider the difference is the whole model call. The
    # failure the 300 s was bought against, a gateway error to a browser with a run still
    # executing behind it, cannot happen any more at any document length. A thirty-page
    # document that takes ten minutes now finishes and the screen shows it.
    #
    # WHAT 300 s BOUNDS NOW is the slowest request that is left, which is `uploadDocument`:
    # up to 26 214 400 bytes through this proxy. Measured in `W20-EXEC` against the running
    # server, three times, 4 KB under the cap: 0.85 s, 0.86 s, 0.87 s. That is the body-read
    # and validation term on loopback, refused at the validator rather than a full accepted
    # upload through a proxy, so it is a FLOOR and not a worst case -- but it settles the
    # order of magnitude as seconds.
    #
    # IT IS STILL 300 s ON PURPOSE. Lowering it would mean claiming a bound, and nothing in
    # this repository measures an accepted cap-sized upload end to end through nginx.
    # Trading a measured margin for a guess is the wrong direction. `W20-EXEC` argued that
    # and `W22-OPS` agrees; what was wrong here was the reason, not the number, and only the
    # reason has changed.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_http_version 1.1;
    # `$http_host` AND NOT `$host` -- `Y-G`, found by `W47-JUDGE-Y` at cross-examination.
    #
    # `$host` is the host name with the PORT STRIPPED. The application builds an absolute
    # redirect out of the request URL, whose authority is this header, so every redirect it
    # produced named **port 80** of whatever the client typed. Measured on the deployed
    # stack on port 56441: `GET /api/v1/dashboard/` answered
    # `location: http://127.0.0.1/dashboard`. Over the owner's own tunnel
    # (`ssh -L 31500:...`) that is port 80 of the OPERATOR'S laptop, and `T-2`'s "one
    # origin" is bent by a redirect that leaves the origin's port.
    #
    # `$http_host` is the Host header as the client sent it, port and all, which is the
    # origin the browser is actually on. HTTP/1.1 requires that header, and nginx answers
    # 400 to a request without one before this line is reached, so there is no case where
    # it is empty and a `$host` fallback would be needed. `$host:$server_port` is NOT the
    # repair: `$server_port` is 8080, this container's internal listen port, not the
    # published one.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The API, at the versioned base path the contract's `servers` declares.
    #
    # THE PREFIX IS STRIPPED, AND THAT IS NOT A CHOICE MADE HERE. Measured against the
    # running container, not assumed: `GET /projects` answers 401 and
    # `GET /api/v1/projects` answers 404. The frozen document declares
    # `servers: [{"url": "/api/v1"}]` and `api/app.py` says the twelve paths "are declared
    # relative to it rather than carrying it", so the application really does serve
    # `/projects`, `/runs/{id}` and the rest at its own root. **Mounting the base path is
    # the deployment's job.**
    #
    # The out-of-repo harness settled this the same way and wrote it down:
    # /root/pdf-prototype/bridge.py does `target = self.path[len(PREFIX):]` before
    # dispatching. A proxy that forwarded the prefix intact would answer 404 to all fifteen
    # operations with a perfectly valid `ErrorEnvelope`, which is the most confusing way
    # this could have failed.
    #
    # The trailing slashes are what does it: `location /api/v1/` with `proxy_pass
    # http://api:8000/` replaces the matched prefix with `/`. The exact-match block below
    # covers the bare `/api/v1`, which nginx would otherwise not rewrite at all.
    # AND THE PREFIX GOES BACK ON THE WAY OUT -- the second half of `Y-G`.
    #
    # `proxy_pass http://api:8000/` strips `/api/v1` on the way in, which is right and is
    # the whole point above. Nothing put it back on the way out, so an absolute redirect
    # from the application named a path this origin serves from the OTHER upstream:
    # `/api/v1/dashboard/` redirected to `/dashboard`, which is the **web screen** of the
    # same name and answers 200. Not a bypass -- the screen renders empty and its data
    # calls answer 401 -- but a caller of the API is sent to the product, which is a
    # correctness defect on the one origin `T-2` promises.
    #
    # `proxy_redirect default` does not reach it: with this `proxy_pass` it expands to
    # `proxy_redirect http://api:8000/ /api/v1/`, and the Location the application builds
    # names the CLIENT's authority (`$http_host` above), never `api:8000`. So the rule is
    # written against any authority instead, and `$1` carries whatever the client asked for.
    #
    # The redirect is left as a redirect rather than removed. Removing it means
    # `redirect_slashes=False` on the application, which is a change to the published
    # surface -- every trailing-slash path would become a 404 instead of a hop -- and that
    # is a decision about the API and not about this file.
    location = /api/v1 {
        proxy_pass http://api:8000/;
        proxy_redirect ~^(https?://[^/]+)/(.*)$ $1/api/v1/$2;
    }

    location /api/v1/ {
        proxy_pass http://api:8000/;
        proxy_redirect ~^(https?://[^/]+)/(.*)$ $1/api/v1/$2;
    }

    # Everything else is the web app.
    location / {
        proxy_pass http://web:3000;
    }
}

# THE TLS SERVER BLOCK. It is not loaded by nginx unless a certificate is present.
#
# This file lives OUTSIDE `/etc/nginx/conf.d/` inside the container -- it is mounted at
# `/etc/nginx/tls-server.conf`, which nginx's own `include /etc/nginx/conf.d/*.conf;` does
# not match. `enable-tls.sh` copies it INTO `conf.d/` and only when both
# `/etc/nginx/tls/fullchain.pem` and `/etc/nginx/tls/privkey.pem` are there and non-empty.
#
# WHY THE SWITCH CANNOT BE IN THIS FILE, which is nginx's behaviour and not a preference:
#
#   * `ssl_certificate` is read when the configuration is PARSED, not when a connection
#     arrives. A block naming a certificate that is not there fails `nginx -t` with
#     "cannot load certificate ... No such file or directory" and the master process
#     REFUSES TO START. In this stack that is not a degraded TLS -- the proxy is the only
#     published port, so the whole site goes dark because of a file nobody had yet;
#   * nginx's configuration language has no conditional inclusion. `include` with a
#     wildcard that matches nothing is legal and is a no-op, but `compose.server.yml`
#     bind-mounts exactly ONE file into `conf.d/`, so a wildcard in `nginx.conf` would have
#     nothing to find and no way to be given anything without editing that file;
#   * the official `nginx` image runs every executable `/docker-entrypoint.d/*.sh` before
#     the master starts. That hook is therefore the only place in this stack where "is
#     there a certificate?" can be ASKED, and the answer acted on, before the parse that
#     would refuse.
#
# THE BODY BELOW IS THE SAME APPLICATION BODY AS `nginx.conf`, deliberately duplicated,
# because `nginx.conf` is mounted as a single file and a shared `include` would need a
# second mount in `compose.server.yml` -- which `W26-OPS` owns. The duplication is not left
# to trust: `tests/integration/composition/test_proxy_tls_path.py` compares the directive
# sequence of the two server blocks and fails if either is changed without the other.
#
# WHAT IS NOT HERE, ON PURPOSE:
#
#   * NO SERVER NAME. `server_name _;` -- the same as the plain block. The host name does
#     not exist yet and this file does not invent one. A certificate names a host; nginx
#     does not need the config to repeat it, and with one server block per listener there
#     is nothing to select between.
#   * NO REDIRECT FROM THE PLAIN PORT. `deploy.sh`'s `proxy-answers` guard fetches
#     `http://127.0.0.1:$ALPHA_HTTP_PORT/api/v1/openapi.json` and refuses anything that is
#     not 200; a `return 301` would turn every successful deploy into a refusal, and
#     `deploy.sh` is not this session's to change. The plain listener keeps serving and the
#     TLS listener is added beside it. An operator who wants the redirect adds it when the
#     host has a name, and must expect to answer for that guard.
#
# THE CLIENT ADDRESS IS NOT HERE EITHER -- `REAL-IP-EDGE-01`. `real_ip_header` and
# `real_ip_recursive` are http-level, declared once in `nginx.conf`, which nginx always loads
# beside this file, and the `set_real_ip_from` lines are written by `trusted-proxies.sh` into
# `conf.d/` -- so this block inherits the same trust list and the same rule as the plain one.
# Repeating either directive here would be a second place for the rule to drift.
# `tests/integration/composition/test_real_client_address_at_the_edge.py` drives this body too.
#
# HSTS, SINCE `W53-CLOSE` `C-18`. This list said "NO HSTS" until then: the header is a promise
# about a HOST NAME, held by a browser for its max-age, and it makes the plain listener
# unreachable by name for every browser that saw it. The closure wave decided to make the
# promise -- `max-age=31536000`, no `includeSubDomains`, no `preload` -- and it is sent only
# HERE, where it is honest: a browser ignores HSTS on a plain-HTTP answer and on an IP
# literal, so the tunnelled `127.0.0.1` stand is untouched, and a host that serves this
# block has a certificate by construction. An operator who turns TLS on for a NAME is
# committing that name to HTTPS for a year; turning TLS off again does not withdraw it.

server {
    # 8443 INSIDE THE CONTAINER, published as 443 by `compose.tls.yml`. The container's
    # nginx runs unprivileged-safe ports for the same reason 8080 is 8080 here.
    listen 8443 ssl;
    # nginx 1.25+ spells HTTP/2 as its own directive; `listen ... http2` is deprecated.
    # The pinned image is 1.27-alpine.
    http2 on;
    server_name _;

    # The certificate and its key, at the path `compose.tls.yml` mounts read-only. The key
    # is placed on the host by the owner and is never in this repository:
    # `proxy/tls/.gitignore` ignores every file in that directory but itself.
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # TLS 1.2 is kept because a client this deployment has never met may need it; 1.0 and
    # 1.1 are not offered. `ssl_ciphers` is the TLS 1.2 list and governs nothing else: the
    # TLS 1.3 suites are not set by it and are all AEAD already. The list is ECDHE (forward
    # secrecy) with an AEAD cipher only, for an RSA pair and an ECDSA pair alike -- the key type
    # is whatever the pinned ACME client issues -- so no CBC suite and no static-RSA suite is
    # negotiable. `HARDEN-01` / `EXPOSURE-REVIEW-02` `F-16`: this comment used to say "1.2's
    # suites here are all AEAD" while NO list was set, and nginx's default `HIGH:!aNULL:!MD5`
    # offers twenty non-AEAD TLS 1.2 suites (`openssl ciphers -v`). `test_proxy_hardening.py`
    # holds the list to that claim. `ssl_prefer_server_ciphers off` is the modern default
    # advice: with only AEAD suites left the client's order is the sane one.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    # HSTS -- this block only, see the header note. Transport, not application body: the
    # drift check in `test_proxy_tls_path.py` sets it aside with the `ssl_*` lines.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # No `ssl_stapling`: it needs a resolver and an OCSP responder reachable from this
    # host, and neither is known before the host is.

    # --- the application body: IDENTICAL to nginx.conf's, see the note above -----------

    client_max_body_size 32m;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_http_version 1.1;
    # `$http_host` and not `$host` -- `Y-G`. See `nginx.conf` for the measurement; the
    # note stays there and is not restated, and this body must not drift from it.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # $scheme is `https` here, so the application is told the truth about the transport
    # without this file saying the word.
    proxy_set_header X-Forwarded-Proto $scheme;

    # The security response headers -- `C-18`. See `nginx.conf` for the reasons, and for the
    # inheritance rule: no `location` below may declare an `add_header` of its own.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "same-origin" always;

    # The prefix goes back on the way out -- `Y-G`, second half. See `nginx.conf`.
    location = /api/v1 {
        proxy_pass http://api:8000/;
        proxy_redirect ~^(https?://[^/]+)/(.*)$ $1/api/v1/$2;
    }

    location /api/v1/ {
        proxy_pass http://api:8000/;
        proxy_redirect ~^(https?://[^/]+)/(.*)$ $1/api/v1/$2;
        # The guest throttle -- `W49-EDGE-01`. The `map` and the `limit_req_zone` it uses
        # are http-level and are declared once, in `nginx.conf`, which nginx always loads
        # beside this file; declaring them here too would stop the master from starting.
        # The reasons for the key, the rate and the 429 are there and are not restated.
        limit_req zone=guest_registration burst=10 nodelay;
        # The token-exchange throttle -- `HARDEN-AUTH-EDGE-01`. Declared once, in `nginx.conf`,
        # beside the registration one; the reasons are there.
        limit_req zone=token_exchange burst=10 nodelay;
        # The runner-channel throttles -- `EXEC-PULL-01`. A zone per token and one per address,
        # declared once, in `nginx.conf`; the key, the rates and why there is no `auth_request`
        # on these paths are there.
        limit_req zone=runner_channel burst=30 nodelay;
        limit_req zone=runner_address burst=120 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
    }

    # The two upload locations -- `W55B-STREAM-01`. See `nginx.conf` for what they are, why they
    # are regex locations with a `rewrite` and a URI-less `proxy_pass`, why they declare no
    # header, and the timeout chain; the note stays there and the body must not drift from it.
    location ~ ^/api/v1/projects/[^/]+/documents(?:/[^/]+/versions)?$ {
        client_max_body_size 260m;
        client_body_timeout 120s;
        proxy_read_timeout 300s;
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_redirect ~^(https?://[^/]+)/(.*)$ $1/api/v1/$2;
        limit_req zone=guest_registration burst=10 nodelay;
        limit_req zone=token_exchange burst=10 nodelay;
        limit_req zone=runner_channel burst=30 nodelay;
        limit_req zone=runner_address burst=120 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        # The credential is checked before the body is read -- see `nginx.conf`.
        auth_request /_edge/credential/api;
        error_page 401 = @authentication_required;
    }

    location ~ ^/bff/v1/projects/[^/]+/documents(?:/[^/]+/versions)?$ {
        client_max_body_size 260m;
        client_body_timeout 120s;
        proxy_read_timeout 300s;
        auth_request /_edge/credential/web;
        error_page 401 = @authentication_required;
        proxy_pass http://web:3000;
    }

    # The credential check that runs before the upload body is read -- `HARDEN-AUTH-EDGE-01`.
    # See `nginx.conf` for what it asks, why it is a subrequest, what it costs and why it
    # carries no body; the note stays there and this body must not drift from it.
    location = /_edge/credential/api {
        internal;
        client_max_body_size 260m;
        proxy_pass http://api:8000/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_edge/credential/web {
        internal;
        client_max_body_size 260m;
        proxy_pass http://web:3000/bff/v1/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The `authentication_required` envelope -- identical to `nginx.conf`'s, see the note there.
    location @authentication_required {
        default_type application/json;
        return 401 '{"contract_version":"1.8.0","error_code":"authentication_required","message":"No valid authenticated subject was presented. The response carries no hint about the addressed resource.","correlation_id":"$request_id","retryable":false}';
    }

    # The `rate_limited` envelope -- identical to `nginx.conf`'s, see the note there.
    location @rate_limited {
        default_type application/json;
        return 429 '{"contract_version":"1.8.0","error_code":"rate_limited","message":"Too many requests of this kind arrived from this client within the throttle window. Nothing was created or changed; the same request may be sent again later.","correlation_id":"$request_id","retryable":true}';
    }

    location / {
        proxy_pass http://web:3000;
    }
}

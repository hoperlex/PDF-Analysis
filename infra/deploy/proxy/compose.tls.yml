# THE 443 OVERLAY -- `PROD-01-TLS-ACME-01` rewrote this file for `ADR-0021` section 2; `R-146s` is why it
# exists as a file of its own. It adds ONE thing: the proxy's container port 8443 published as public 443.
#
#   docker compose --env-file infra/deploy/env/alpha.env \
#     -f infra/deploy/compose.server.yml \
#     -f infra/acme/compose.acme.yml \
#     -f infra/deploy/proxy/compose.tls.yml up -d
#
# `deploy.sh` passes it (`infra/deploy/lib/proxy-listeners.sh` decides) for a deploy that BOTH may open the
# application to the public AND already has a certificate pair, and recreates the proxy WITHOUT it
# otherwise. That is the whole mechanism of `R-146s`: *443 exists only when the gate allows it*, and a host
# that has never been published, or whose default credential came back with a restore, serves the challenge
# port and the loopback application port and nothing else. Today the gate is the explicit setting
# `ALPHA_PUBLISH_HTTPS=yes`; `PROD-02` replaces that one setting by the default-credential check.
#
# IT IS USELESS ALONE, deliberately. The TLS server block, its switch, the certificate volume and the
# watcher are mounted by `infra/acme/compose.acme.yml`, which is the file that is present whenever a
# certificate name is configured; this overlay is never passed without it (`proxy-listeners.sh` cannot
# produce that list, and `test_acme_overlay.py` asserts it). Before this rewrite the overlay mounted a
# certificate DIRECTORY the owner filled by hand (`proxy/tls/`); nothing reads that directory now, and a
# pair is only ever the one the ACME client exported (`R-146a`: a certificate placed and renewed by hand was
# rejected as the design).
#
# `ADR-0021` row 6 reads this file's effect off the running stack: with the overlay absent,
# `docker compose ... port proxy 8443` exits non-zero, and with it present it prints the mapping.
#
# THE INTERFACE IS `ALPHA_PUBLIC_ADDRESS` (all interfaces unless the host says one), the SAME variable as the
# challenge port, so port 80 and port 443 are public or not public together. It is NOT `ALPHA_BIND_ADDRESS`:
# that one still governs the plain APPLICATION listener (`compose.server.yml`), which must stay on loopback
# whenever ACME is configured (`deploy.sh` refuses otherwise). The names this file substitutes are a host
# interface and a port number, both safe for `docker compose config` to print.

services:
  proxy:
    ports:
      - "${ALPHA_PUBLIC_ADDRESS:-0.0.0.0}:${ALPHA_HTTPS_PORT:-443}:8443"

name: deploy-auto

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: auditmanager-alpha-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy exact AuditManager revision
    # Strictly opt-in, never a silent skip of a configured deploy: GitHub deploys over SSH only in a repository whose owner sets the
    # variable DEPLOY_MODE=github, together with the DEPLOY_* variables and the VPS_* secrets. With it unset the job does not
    # start and nothing turns red (a fork's server deploys itself: infra/deploy/deploy-local.sh, the installer's default
    # `--deploy-mode local`, and needs nothing in GitHub). Opted in without the values, it refuses below (owner rulings R-158f, R-158h).
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_MODE == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077

          # The server is named by this repository's own variables, never by source (owner ruling R-158f).
          # A fork starts without them and so deploys nowhere until its owner names its own server.
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_HOST and DEPLOY_KNOWN_HOSTS are not configured for this repository (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          if [ -z "$SSH_KEY" ]; then
            echo "::error::VPS_SSH_KEY is not configured."
            exit 1
          fi
          readonly HOST_NAME='^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$'
          if ! [[ "$DEPLOY_HOST" =~ $HOST_NAME ]]; then
            echo "::error::DEPLOY_HOST is not a host name or an IPv4 address."
            exit 1
          fi

          # Every line is a plain host key (no comment, marker or hashed host), and one of them names
          # DEPLOY_HOST. The key is verified out of band before it is stored (DEPLOYMENT_RUNBOOK section 3).
          readonly KEY_LINE='^([^[:space:]#@|][^[:space:]]*)[[:space:]]+(ssh-ed25519|ecdsa-sha2-nistp256|ecdsa-sha2-nistp384|ecdsa-sha2-nistp521|ssh-rsa)[[:space:]]+[A-Za-z0-9+/]+=*$'
          named=0
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"
            [ -n "$line" ] || continue
            if ! [[ "$line" =~ $KEY_LINE ]]; then
              echo "::error::DEPLOY_KNOWN_HOSTS holds a line that is not a plain host key."
              exit 1
            fi
            IFS=',' read -r -a names <<< "${BASH_REMATCH[1]}"
            for name in "${names[@]}"; do
              if [ "$name" = "$DEPLOY_HOST" ]; then
                named=1
              fi
            done
          done <<< "$DEPLOY_KNOWN_HOSTS"
          if [ "$named" -ne 1 ]; then
            echo "::error::DEPLOY_KNOWN_HOSTS has no key for DEPLOY_HOST."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy and verify exact commit
        env:
          VPS_HOST: ${{ vars.DEPLOY_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          readonly CHECKOUT_PATH='^(/[A-Za-z0-9_.-]+)+$'
          if ! [[ "$DEPLOY_PATH" =~ $CHECKOUT_PATH ]] || [[ "$DEPLOY_PATH/" == */../* ]] || [[ "$DEPLOY_PATH/" == */./* ]]; then
            echo "::error::DEPLOY_PATH is not configured as the absolute path of the server's checkout."
            exit 1
          fi

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -i "$HOME/.ssh/deploy_key" \
            "${VPS_USER}@${VPS_HOST}" \
            bash -s -- "$DEPLOY_SHA" "$DEPLOY_PATH" "$DEPLOY_REPOSITORY" <<'REMOTE'
          set -euo pipefail

          readonly DEPLOY_SHA="$1"
          readonly REPOSITORY="$2"
          readonly SOURCE_REPOSITORY="$3"

          cd "$REPOSITORY"

          echo "=== deployment source ==="
          # A server deploys only the repository it was cloned from (owner ruling R-158f): a fork that
          # holds this server's credentials still cannot roll it back to the fork point. The check reads
          # owner/name from origin in any form (https, git@, ssh://, an ssh alias) and ignores case.
          origin_url="$(git remote get-url origin)"
          checkout_of="$(printf '%s\n' "$origin_url" | sed -E 's#/+$##; s#\.git$##; s#^.*[:/]([^:/]+)/([^:/]+)$#\1/\2#')"
          printf '%s\n' "$SOURCE_REPOSITORY"
          if [ "${checkout_of,,}" != "${SOURCE_REPOSITORY,,}" ]; then
            echo "REFUSED: $REPOSITORY is a checkout of '$checkout_of', but this deployment comes from '$SOURCE_REPOSITORY'." >&2
            echo "A server deploys only the repository it was cloned from; a fork names its own server in its own repository variables." >&2
            exit 4
          fi

          echo "=== requested revision ==="
          printf '%s\n' "$DEPLOY_SHA"

          echo "=== host before deployment ==="
          git rev-parse HEAD
          # The AR v3 removal (PR #55) deleted infra/deploy/ar-v3-pack/.gitignore, so the
          # operator-installed pack files left on the host became untracked and refused run 95.
          # They stay on the host and stay ignored, host-locally; nothing is deleted here.
          if [ -d .git ]; then
            mkdir -p .git/info
            grep -qxF '/infra/deploy/ar-v3-pack/' .git/info/exclude 2>/dev/null \
              || printf '%s\n' '/infra/deploy/ar-v3-pack/' >> .git/info/exclude
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "REFUSED: $REPOSITORY has tracked or untracked changes." >&2
            git status --short >&2
            exit 3
          fi

          echo "=== fetch publication authority ==="
          GIT_TERMINAL_PROMPT=0 git fetch --prune origin

          echo "=== verify requested revision ==="
          git cat-file -e "${DEPLOY_SHA}^{commit}"
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main

          echo "=== select exact revision ==="
          git checkout --detach "$DEPLOY_SHA"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "REFUSED: $DEPLOY_SHA leaves tracked or untracked changes in $REPOSITORY." >&2
            git status --short --untracked-files=all >&2
            exit 3
          fi

          echo "=== deploy ==="
          # bash -s reads this script from stdin. Neither child may consume the
          # remaining verification commands as its own input.
          infra/deploy/deploy.sh </dev/null

          echo "=== verify deployed tree ==="
          infra/deploy/verify-deployed.sh </dev/null

          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

          echo "DEPLOY OK: $DEPLOY_SHA"
          REMOTE

      - name: Remove SSH material
        if: always()
        run: |
          rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

name: run-hotfix-diagnostics

on:
  workflow_run:
    workflows: [deploy-auto]
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        required: true
        default: status
        options: [status, reaudit-unmetered]
      run_id:
        type: string
        required: true

concurrency:
  group: run-hotfix-diagnostics-1106
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  operator:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       contains(github.event.workflow_run.head_commit.message, '[run-complete-1106]'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Inspect or repeat the run through the configured application
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          OPERATION: ${{ inputs.operation || 'reaudit-unmetered' }}
          RUN_ID: ${{ inputs.run_id || 'run_01M6RJPRWTC1ER59JXJZN2C76H' }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          umask 077
          case "$OPERATION" in status|reaudit-unmetered) ;; *) exit 2 ;; esac
          [[ "$RUN_ID" =~ ^run_[0-9A-HJKMNP-TV-Z]{26}$ ]]
          [[ "$CHECKED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          case "$VPS_HOST" in 135.106.164.147|audit.135.106.164.147.sslip.io) ;; *) exit 2 ;; esac
          test -n "$SSH_KEY"
          mkdir -p "$HOME/.ssh"
          trap 'rm -f "$HOME/.ssh/hotfix_key" "$HOME/.ssh/hotfix_hosts"' EXIT
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/hotfix_key"
          printf '%s\n' '135.106.164.147 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPZcfVwHVIUEU7W0auTb70VKY/aLppXM/54vzpmy0+XV' 'audit.135.106.164.147.sslip.io ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPZcfVwHVIUEU7W0auTb70VKY/aLppXM/54vzpmy0+XV' > "$HOME/.ssh/hotfix_hosts"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/hotfix_hosts" -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i "$HOME/.ssh/hotfix_key" \
            "${VPS_USER}@${VPS_HOST}" bash -s -- "$CHECKED_SHA" "$OPERATION" "$RUN_ID" <<'REMOTE'
          set -euo pipefail
          cd /srv/auditmanager
          test "$(git rev-parse HEAD)" = "$1"
          operation="$2"
          run_id="$3"
          args=("$operation" "$run_id")
          if [ "$operation" = reaudit-unmetered ]; then
            args+=(--key HOTFIX-RUN-COMPLETE-1106)
          fi
          operator() {
            docker compose --env-file infra/deploy/env/alpha.env \
              -f infra/deploy/compose.server.yml exec -T api \
              python -m auditmanager.runs.hotfix_operator "$@" </dev/null
          }
          if [ "$operation" = status ]; then
            operator "${args[@]}"
            exit
          fi
          # Diagnose the immutable parent, then admit exactly one fresh unmetered
          # run through the ordinary command. The task key makes re-delivery safe.
          operator status "$run_id"
          accepted="$(operator "${args[@]}")"
          printf '%s\n' "$accepted"
          child="$(printf '%s' "$accepted" | python3 -c 'import json,sys; print(json.load(sys.stdin)["run_id"])')"
          [[ "$child" =~ ^run_[0-9A-HJKMNP-TV-Z]{26}$ ]]
          for ((attempt=0; attempt<110; attempt++)); do
            result="$(operator status "$child")"
            printf '%s\n' "$result"
            state="$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])')"
            case "$state" in
              published) echo 'LIVE RUN COMPLETE'; exit 0 ;;
              partial|failed|cancelled) echo 'LIVE RUN INCOMPLETE'; exit 4 ;;
            esac
            sleep 45
          done
          echo 'LIVE RUN STILL ACTIVE: observation deadline reached'
          exit 5
          REMOTE

# P1-INT-00 owns this file. It is the single declaration of the foundation Python
# toolchain and its exact dependency pins for the P01 PostgreSQL/S3 slice.
#
# Provider lanes (P1-INF-01, P1-DB-01, P1-STO-01, P1-QA-00) consume these pins and
# must not add, remove or upgrade a dependency here. A pin change is a new
# single-owner task, per FF-01 section 2 item 8.

[project]
name = "auditmanager-foundation"
version = "0.0.0"
description = "AuditManager P01 foundation runtime: PostgreSQL and private S3-compatible storage providers."
requires-python = "==3.12.*"

# Runtime dependencies. Each entry names the FF-01 capability that requires it;
# nothing needed only by a later stage is present (P1-INT-00 non-goals).
dependencies = [
    # PostgreSQL driver for the session/transaction adapter and the DB/service checks.
    "psycopg[binary]==3.3.5",
    # Session and transaction foundation (P1-DB-01).
    "SQLAlchemy==2.0.52",
    # Migration runner and baseline migration infrastructure (P1-DB-01).
    "alembic==1.19.2",
    # S3 API client for the BlobStore adapter (P1-STO-01) and private-bucket
    # initialization plus the service health check (P1-INF-01).
    "boto3==1.43.90",
    # --- P02 pins, owned by B-0. See docs/program/P02_LOCK.json. ---
    # PDF text extraction with per-character geometry (OD-01). pdfplumber exposes
    # x0/x1/top/bottom, fontname and size per character and groups runs into lines, which
    # is what B2 needs for stable character offsets and for the block index's page,
    # bounding box and text-span anchors. MIT, over MIT pdfminer.six. PyMuPDF/fitz is
    # excluded: it is AGPL, and OD-01 blocks a copyleft library until the owner rules
    # otherwise.
    "pdfplumber==0.11.10",
    # The separate page-count and encryption probe OD-01 requires. It answers "is this
    # inside the envelope" without parsing content, so a 31-page or encrypted input is
    # refused before any extraction runs. BSD-3.
    "pypdf==6.18.0",
    # Model provider SDK (OD-02). Anthropic first-party API. MIT.
    "anthropic==1.4.0",
    # --- Alpha transport pins, owner-ruled 2026-09-17 (R-2). ---
    # `ADR-0002`, `TECHNOLOGY_BASELINE.md`, `ARCHITECTURE_BIBLE.md` P-05 and
    # `PROTOTYPE_PROFILE.md` §2 have named FastAPI since the bootstrap; the lock never
    # carried it, and `api/README.md` described that absence as a decision until the owner
    # corrected it. A pin set records what a lane may install; it cannot overrule an ADR.
    #
    # The addition is five distributions because `anthropic` already pulled this family's
    # cores into the closure: pydantic 2.13.5 (fastapi needs >=2.9.0), typing_extensions
    # 4.16.0 (>=4.8.0), anyio 4.15.1 (starlette needs <5,>=3.6.2) and h11 0.16.0
    # (uvicorn needs >=0.8) are all already present and are not additions.
    #
    # Licences read from each wheel's own METADATA, not recalled. OD-01 blocks copyleft;
    # all five are permissive and none comes close.
    "fastapi==0.141.1",       # MIT
    "starlette==1.6.0",       # BSD-3-Clause — fastapi's ASGI toolkit
    "uvicorn==0.53.0",        # BSD-3-Clause — the ASGI server
    "click==8.5.0",           # BSD-3-Clause — uvicorn's only unmet requirement
    "python-multipart==0.0.32",  # Apache-2.0 — FastAPI's multipart parser for uploadDocument
]

[dependency-groups]
# Foundation test runner. Synced explicitly by `make bootstrap` with `--group test`;
# it is not a default group, so no lane can pull it in implicitly.
test = [
    "pytest==9.1.1",
    # The ASGI test client, owner-ruled 2026-09-17 (R-2, "full set").
    #
    # `starlette.testclient` does `import httpx`, and httpx is NOT importable in this
    # environment: what the closure carries is `httpx2` 2.12.0, a *different* distribution
    # providing a different module name. The alpha plan's stage 0 anticipated exactly this
    # and told the stream to report what is resolvable rather than assume a name. Measured
    # rather than assumed, so it is a real sixth pin and it is named here.
    #
    # It lives in the test group, not in runtime dependencies: nothing under `src/` imports
    # it, and a client library in the runtime closure of a deployed application is surface
    # for no purpose.
    "httpx==0.28.1",          # BSD-3-Clause
]

[tool.pytest.ini_options]
# Root-owned, so the LITERAL provider commands work with no PYTHONPATH override and no
# lane-local sys.path hack:
#     .venv/bin/pytest tests/integration/db
#     .venv/bin/pytest tests/integration/storage
# `pythonpath` is relative to rootdir, which is this file's directory. Together with the
# `PYTHONPATH=src` used by the Makefile's module invocations these are the only two
# supported import mechanisms for foundation code under src/; a lane that adds sys.path
# juggling to a conftest is working around that contract, not extending it.
pythonpath = ["src"]
# importlib import mode. Test modules are imported by full path instead of by basename
# with sys.path insertion, so two lanes that both name a file `test_checks.py` do not
# collide with "import file mismatch" when anything collects their directories in one
# run. The alternative would be scattered __init__.py files in every lane. There is no
# dedicated ini key for this, so it goes through addopts.
addopts = ["--import-mode=importlib"]

[tool.uv]
# Virtual project: dependencies are locked and installed, but this repository is not
# built or installed as a distribution. Foundation code under `src/` is reached through
# the two mechanisms above - `PYTHONPATH=src` for the module invocations recorded in
# FOUNDATION_LOCK.json, and the pytest `pythonpath` setting for literal pytest commands.
# This keeps `make bootstrap` free of a build backend and of any wheel build when a
# provider lane adds a module.
package = false

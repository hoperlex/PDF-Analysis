# Configuration of agent.py (the unattended pull agent). Copy to /etc/pdf-analysis-agent/agent.toml.
# `install.sh` writes this file for you and keeps your edits on a rerun. This example is the SINGLE-MODEL agent (one
# CLI, its pinned model, `concurrency = 1`; what `install.sh --model ID` writes). The HOST agent (what `install.sh` writes
# with no model; one process serving every model the host can reach) is `[executor] mode = "host"`: see the end of this file.
#
# Secrets never go in this file. The runner token comes from the environment variable named in
# token_env (the systemd unit loads it from an EnvironmentFile with mode 0600); an endpoint key,
# if any, from the variable named in api_key_env. A key called token, secret, password or
# api_key in this file is refused at start.

[runner]
# The stand's public HTTPS origin: scheme://host[:port], no path.
origin = "https://stand.example.org"
token_env = "PDF_ANALYSIS_RUNNER_TOKEN"
# Long-poll length of one claim, 0..25 seconds.
wait_seconds = 25
# Tasks worked on at the same time (1..8). The connection's "max claimed tasks" bounds it too. The agent tells
# the stand this number in its health report; install.sh writes 1, and raising it is the administrator's act.
concurrency = 1
# On SIGTERM: how long tasks in flight may keep working before they are failed as agent_shutdown.
# Keep systemd's TimeoutStopSec above drain_seconds + wait_seconds.
drain_seconds = 60
# ca_file = "/etc/ssl/private-ca.pem"      # only for a private CA
# allow_insecure_http = false              # http:// for a non-loopback host; closed test networks only

[model]
# The exact pinned model id this agent answers as. It must equal the model the connection pins
# (claude-opus-5 or claude-sonnet-5 today, R-143g). The stand compares it with the revision
# and refuses any other (R-133). A task that pins another model is failed as model_mismatch
# before any work starts. This is an assertion by the operator: declare only what is true.
declared = "claude-sonnet-5"

[executor]
# "command": the task JSON goes to the command's stdin, the command's stdout is the answer.
# "endpoint": a local OpenAI-compatible /v1/chat/completions server (Ollama, vLLM, llama.cpp).
mode = "command"

[command]
# The task document on stdin: {"task_id", "model", "system", "user_text", "output_schema",
# "claim_expires_at", "deadline_at"}. Print ONE JSON document on stdout that validates against
# output_schema (no code fence, no prose) and exit 0. Anything else fails the task.
argv = ["/usr/bin/python3", "/opt/pdf-analysis-agent/answer.py"]
timeout_seconds = 540
# Set true only when the command consumes local_images PNG paths (codex_answer.py does).
accept_images = false
# The most images one task may carry that the command serves, 1 to 8 (default 1; above 1 needs
# accept_images = true). The stand never hands a task with more; codex_answer.py serves up to 8.
# max_images = 1
# cwd = "/opt/pdf-analysis-agent"

# [endpoint]    # used when mode = "endpoint"
# url = "http://127.0.0.1:11434/v1/chat/completions"
# model = "qwen2.5:72b-instruct"        # the local model name sent to the endpoint
# api_key_env = ""                      # optional: environment variable holding the endpoint's key
# timeout_seconds = 540
# response_format = "none"              # "none", "json_object" or "json_schema" (constrained decoding)
# temperature = 0
# max_tokens = 0                        # 0 = leave to the server
# accept_images = false                # set true only if the local model accepts image_url data URLs
# max_images = 1                       # images per task the model sees, 1 to 8; above 1 needs accept_images

# ---------------------------------------------------------------------------------------------------------------------
# HOST MODE (HOSTS-AGENT-01, RUNNER_API.md section 10). Use INSTEAD of [model], [command] and [endpoint]:
#
#   [runner]
#   origin = "https://stand.example.org"
#   token_env = "PDF_ANALYSIS_RUNNER_TOKEN"   # the token of the HOST (install.sh enrolls it); no [model] is declared
#
#   [executor]
#   mode = "host"
#
#   [host]
#   key_file = "/etc/pdf-analysis-agent/keys.env"   # ANTHROPIC_API_KEY=, OPENAI_API_KEY=, OPENROUTER_API_KEY= (one per line);
#                                                    # read only when it is mode 0600 and owned by the service user
#   # detect_seconds = 60              # cheap detection (CLI present, version, login, key file; no model is called)
#   # report_seconds = 60              # the heartbeat; the snapshot in it is rebuilt only when something changed
#   # probe_interval_seconds = 21600   # a minimal call per catalogue model: when a login/key/version changed, and this often
#   # failed_retry_seconds = 900       # ... and this often for a model whose last call failed
#   # activity_window_seconds = 600    # a claim is extended only while the call produced output in this many seconds (equal to the stand's stall window)
#   # report_cli_path = false          # true: send the CLI's absolute path in the report (ADR-0026 decision 8 says it stays local)
#   # accept_images = false            # true: serve tasks with images (Codex and the API providers; not Claude Code)
#
#   [slots]                           # concurrent calls per provider; default 1 on a subscription login, 2 on an API
#   # claude_code = 1                 # providers: claude_code, codex, anthropic_api, openai_api, openrouter_api
#
#   [api]                             # only for a proxy or a test: https://, or http:// for a loopback host
#   # anthropic_base_url = "https://api.anthropic.com"
#   # openai_base_url = "https://api.openai.com"
#   # openrouter_base_url = "https://openrouter.ai/api"

; P1-DB-01 / A1 owns this file. It is the reserved migration-runner configuration
; named in docs/program/FOUNDATION_LOCK.json, invoked verbatim as:
;
;     PYTHONPATH=src .venv/bin/python -m alembic --config db/migrations/alembic.ini upgrade head
;
; There is no `sqlalchemy.url` here on purpose. The connection value is DATABASE_URL,
; one of the fifteen names FF-01 freezes, and env.py reads it through
; auditmanager.shared.db.config so the migration runner and the application validate
; it the same way. A URL in this file would be a second, unfrozen source of truth and
; would be committed to git.

[alembic]
; %(here)s is this file's own directory, so the script location resolves the same way
; from the repository root, from a test's working directory and from anywhere else.
script_location = %(here)s

; No `prepend_sys_path`. FOUNDATION_LOCK.json's import contract declares exactly two
; supported mechanisms - PYTHONPATH=src for module invocations, and pythonpath=["src"]
; in pyproject.toml for pytest - and adding a third here would be the same workaround
; the contract forbids in a conftest, moved into an ini file. `make migrate` sets
; PYTHONPATH=src; anyone running Alembic by hand sets it too, and gets an explicit
; ImportError rather than a silent second import path if they do not.

; Zero-padded numeric prefix plus a slug. The prefix orders the directory listing for
; a human; the `revision` identifier inside the file is what Alembic actually walks.
file_template = %%(rev)s_%%(slug)s

; Timestamps in migration files are UTC.
timezone = UTC

; How Alembic splits the path-valued options above. Set explicitly: the legacy
; fallback splits on spaces, commas AND colons, which silently mangles any absolute
; path, and Alembic warns about relying on it.
path_separator = os

[post_write_hooks]
; No hooks. A formatter run at write time would be an unpinned tool in the migration
; path; the root lock names no formatter.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
